# ELİŞA Konfigürasyonu
assistant:
  name: "ELİŞA"
  wake_words: ["hey elişa uyan", "hey elisha uyan", "elişa uyan", "elisha uyan", "hey elişa", "hey elisha", "elişa", "elisha"]
  language: tr
  persona: "elisa_girl"  # jarvis kız versiyonu - zarif, zeki, sıcak
  gender: "female"
  voice: "female"
  voice_response: true
  description: "Türkçe, kız, JARVIS benzeri ama sıcak ve zarif - Piper tr_TR-dfki-medium kadın sesi"
  wake_phrase: "hey elişa uyan"  # sadece bununla uyanır, Siri gibi

audio:
  sample_rate: 16000
  channels: 1
  record_seconds: 6
  vad_aggressiveness: 2  # 0-3
  silence_threshold_ms: 900
  # Barge-in (konuşurken söz kesme): konuşma algılama hassasiyeti
  barge_threshold: 0.035   # RMS eşiği (düşük = daha hassas, yüksek = daha katı)
  barge_grace_s: 0.8       # cevabın ilk kaç saniyesinde kesme dinlenmez

stt:
  provider: auto  # auto | faster-whisper | whisper | mock
  model: medium   # tiny/base/small/medium - Türkçe için medium en iyi denge
  language: tr
  device: auto    # auto | cpu | cuda

tts:
  provider: auto  # auto | piper | pyttsx3 | mock
  voice: tr_TR-dfki-medium
  gender: female  # female | male — Piper ses seçimi
  # Mevcut Türkçe sesler:
  #   female: tr_TR-dfki-medium (varsayılan, yüksek kalite)
  #   male: tr_TR-fahrettin-medium (henüz mevcut değil, indirmek için download_voice())
  # Piper sesleri: https://huggingface.co/rhasspy/piper-voices
  speed: 1.0
  piper_model_path: ./voices/tr_TR-dfki-medium.onnx

llm:
  provider: auto  # auto | ollama | groq | gemini | mock
  # Auto sıralaması: groq (hızlı+akıllı) > gemini (iyi Türkçe) > ollama (yerel) > mock
  model: qwen2.5:7b
  fallback_model: qwen2.5:1.5b
  host: http://localhost:11434
  # Cloud modelleri (API key env variable'dan okunur, config'e yazılmaz)
  groq_model: openai/gpt-oss-120b          # GROQ_API_KEY env — 120B, hızlı, iyi Türkçe
  gemini_model: gemini-flash-latest         # GEMINI_API_KEY env
  temperature: 0.7      # 0.7: doğal ve akıcı (0.5 çok robotik, 1.0 çok rastgele)
  max_tokens: 2048      # 1500→2048: uzun cevaplarda kesilme olmasın

agent:
  enabled: true       # V2 gerçek agent döngüsü (native tool calling)
  max_steps: 8        # tek istekte en fazla araç çağrısı + tur sayısı

memory:
  enabled: true
  backend: sqlite
  db_path: data/elisha.db
  session_id: default

security:
  require_confirmation_for:
    - HIGH
    - CRITICAL
  # Tamamen engellenen araçlar — LLM bunları göremez, çağıramaz
  blocked_tools: []
  # Boş = hiçbir şey engellenmez, hepsi izin sistemiyle korunur

wakeword:
  enabled: true
  provider: openwakeword  # openwakeword | disabled
  threshold: 0.5
  model: hey_jarvis  # openwakeword built-in, custom "elişa" için eğitim gerekir (V2)

skills:
  enabled: ["system", "files", "apps", "websearch", "memory"]
  system:
    allow_shell: false  # true yaparsan "komut çalıştır" aktif olur (dikkat)
  websearch:
    enabled: true
    provider: duckduckgo  # ücretsiz, API anahtarı yok

android:
  # Android'de düşük RAM için küçük modeller
  stt_model: tiny
  llm_model: qwen2.5:1.5b
  tts_voice: tr_TR-dfki-medium

# Araç ayarları
tools:
  run_shell:
    enabled: true   # shell açık — ama CRITICAL seviye, her seferinde izin sorar
    allowlist: [ls, df, uptime, whoami, pwd, date, cat, echo, mkdir, cp, mv, rm, open, brew, pip, python3, node, npm, git]
    timeout: 10
  delete_file:
    enabled: true   # dosya silme açık — HIGH seviye, her seferinde izin sorar
