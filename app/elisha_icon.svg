<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sphere gradient — koyu uzay tonu -->
    <radialGradient id="bg" cx="38%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#1a1e3a"/>
      <stop offset="55%"  stop-color="#0c0e1e"/>
      <stop offset="100%" stop-color="#05060c"/>
    </radialGradient>
    <!-- Üst parlaklık -->
    <radialGradient id="shine" cx="30%" cy="20%" r="52%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- Sol X (cyan) glow filtresi -->
    <filter id="gcyan" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Sağ X (pink) glow filtresi -->
    <filter id="gpink" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Parlak iç çizgi filtresi -->
    <filter id="gcore" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Küre gövdesi -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="url(#shine)"/>

  <!-- Dış halka — cyan kenar -->
  <circle cx="32" cy="32" r="29.5" fill="none"
          stroke="rgba(0,212,255,0.55)" stroke-width="1"/>
  <!-- İç halka — zayıf mor -->
  <circle cx="32" cy="32" r="26" fill="none"
          stroke="rgba(168,85,247,0.18)" stroke-width="0.6"
          stroke-dasharray="3 4"/>

  <!-- Yüzey plaka — sol üst -->
  <ellipse cx="22" cy="19" rx="7" ry="4.5"
           fill="rgba(50,70,120,0.25)" stroke="rgba(100,150,200,0.12)"
           stroke-width="0.5" transform="rotate(-18,22,19)"/>

  <!-- ══ SOL X (CYAN) ══ -->
  <!-- Glow katmanı -->
  <g filter="url(#gcyan)">
    <line x1="11" y1="19" x2="26" y2="45" stroke="#00d4ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="19" x2="11" y2="45" stroke="#00d4ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Parlak iç çizgi -->
  <g filter="url(#gcore)">
    <line x1="11" y1="19" x2="26" y2="45" stroke="rgba(230,252,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="26" y1="19" x2="11" y2="45" stroke="rgba(230,252,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ══ SAĞ X (PINK) ══ -->
  <g filter="url(#gpink)">
    <line x1="38" y1="19" x2="53" y2="45" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
    <line x1="53" y1="19" x2="38" y2="45" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g filter="url(#gcore)">
    <line x1="38" y1="19" x2="53" y2="45" stroke="rgba(255,220,240,0.85)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="53" y1="19" x2="38" y2="45" stroke="rgba(255,220,240,0.85)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Alt yatay detay çizgisi -->
  <line x1="22" y1="52" x2="42" y2="52"
        stroke="rgba(0,212,255,0.35)" stroke-width="0.7"/>
</svg>
