<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ELİŞA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent;font-family:Outfit,system-ui,-apple-system,sans-serif;color:#f0f0ff}

/* Ana konteyner — şeffaf arka plan üstünde yüzen panel */
.container{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  padding:12px;
  -webkit-app-region:drag;
}

/* Glass panel */
.panel{
  flex:1;display:flex;flex-direction:column;
  background:rgba(10,10,20,.82);
  backdrop-filter:blur(40px) saturate(1.4);
  -webkit-backdrop-filter:blur(40px) saturate(1.4);
  border:1px solid rgba(124,58,237,.25);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
  -webkit-app-region:no-drag;
}

/* Üst bar */
.topbar{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,.06);
  -webkit-app-region:drag;
}
.brand{display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;box-shadow:0 0 8px #a78bfa;animation:pulse 2s infinite}
.brand-name{font-weight:700;font-size:13px;letter-spacing:.03em}
.status-pill{font-size:10px;padding:4px 10px;border-radius:99px;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.2);color:#c4b5fd}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Orb bölgesi */
.orb-section{
  padding:20px 0;display:flex;flex-direction:column;align-items:center;
}
.orb{
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff 0%,#ffd6e8 10%,#ff2e97 25%,#7c3aed 55%,#1a0a2e 80%);
  box-shadow:0 0 0 8px rgba(124,58,237,.1), 0 0 30px rgba(255,46,151,.3);
  animation:breathe 3s ease-in-out infinite;
  transition:all .3s;
}
.orb.listening{
  animation:breathe .8s ease-in-out infinite;
  box-shadow:0 0 0 12px rgba(255,46,151,.2), 0 0 50px rgba(255,46,151,.5);
}
.orb.speaking{
  animation:speak-pulse 1s ease-in-out infinite;
  box-shadow:0 0 0 10px rgba(6,182,212,.15), 0 0 40px rgba(6,182,212,.4);
  background:radial-gradient(circle at 30% 25%,#fff 0%,#d6f5ff 10%,#06b6d4 25%,#7c3aed 55%,#1a0a2e 80%);
}
.orb.thinking{
  animation:think-spin 2s linear infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes speak-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes think-spin{0%{box-shadow:0 0 0 8px rgba(124,58,237,.2), 0 0 30px rgba(124,58,237,.3)}50%{box-shadow:0 0 0 14px rgba(124,58,237,.3), 0 0 50px rgba(124,58,237,.5)}100%{box-shadow:0 0 0 8px rgba(124,58,237,.2), 0 0 30px rgba(124,58,237,.3)}}

.orb-label{margin-top:10px;font-size:11px;color:#9aa0b8;font-weight:400}
.agent-status-text{margin-top:4px;font-size:12px;color:#c4b5fd;font-weight:600;min-height:16px}

/* Chat bölgesi */
.messages{
  flex:1;overflow-y:auto;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:rgba(124,58,237,.3);border-radius:2px}

.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;animation:pop .2s ease}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:11px;color:#6b7280;padding:4px 10px}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}

/* Input alanı */
.input-area{
  padding:10px 12px;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;gap:8px;align-items:center;
}
.input-area input{
  flex:1;height:36px;border-radius:12px;
  border:1px solid rgba(124,58,237,.2);
  background:rgba(255,255,255,.05);
  color:#fff;padding:0 12px;font-size:13px;
  outline:none;transition:all .2s;
}
.input-area input:focus{border-color:rgba(124,58,237,.5);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.input-area input::placeholder{color:#6b7280}

.btn-mic{
  width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ff2e97,#7c3aed);
  color:#fff;font-size:16px;cursor:pointer;
  display:grid;place-items:center;
  transition:transform .15s;
}
.btn-mic:hover{transform:scale(1.08)}
.btn-mic:active{transform:scale(.95)}
.btn-mic.active{animation:mic-pulse 1s infinite;box-shadow:0 0 20px rgba(255,46,151,.5)}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,46,151,.4)}50%{box-shadow:0 0 0 8px rgba(255,46,151,0)}}

.btn-send{
  width:36px;height:36px;border-radius:12px;border:none;
  background:rgba(124,58,237,.2);color:#a78bfa;
  font-size:14px;cursor:pointer;
  display:grid;place-items:center;transition:all .15s;
}
.btn-send:hover{background:rgba(124,58,237,.4);transform:translateY(-1px)}

/* Alt bilgi */
.footer{
  padding:6px 14px 8px;display:flex;justify-content:space-between;align-items:center;
  font-size:10px;color:#4b5563;
}
.footer label{display:flex;align-items:center;gap:4px;cursor:pointer}
.footer input[type=checkbox]{width:12px;height:12px;accent-color:#7c3aed}
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-name">ELİŞA</span>
      </div>
      <div class="status-pill" id="statusPill">bağlanıyor...</div>
    </div>

    <div class="orb-section">
      <div class="orb" id="orb"></div>
      <div class="orb-label" id="orbLabel">Hazır</div>
      <div class="agent-status-text" id="agentStatus"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Yaz veya konuş..." autocomplete="off"/>
      <button class="btn-mic" id="btnMic">🎙️</button>
      <button class="btn-send" id="btnSend">↑</button>
    </div>

    <div class="footer">
      <span id="hint">Hazır</span>
      <label><input type="checkbox" id="ttsToggle" checked/> sesli</label>
    </div>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');
const btnMic = document.getElementById('btnMic');
const orb = document.getElementById('orb');
const orbLabel = document.getElementById('orbLabel');
const agentStatus = document.getElementById('agentStatus');
const statusPill = document.getElementById('statusPill');
const hint = document.getElementById('hint');
const ttsToggle = document.getElementById('ttsToggle');

function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  return d;
}

function setOrb(state){
  orb.className = 'orb ' + (state || '');
  if(state==='listening') orbLabel.textContent = 'Dinliyor...';
  else if(state==='speaking') orbLabel.textContent = 'Konuşuyor...';
  else if(state==='thinking') orbLabel.textContent = 'Düşünüyor...';
  else orbLabel.textContent = 'Hazır';
}

function setStatus(t){
  agentStatus.textContent = t || '';
  hint.textContent = t || 'Hazır';
}

async function sendText(text){
  if(!text.trim()) return;
  addMsg(text, 'user');
  input.value = '';
  setOrb('thinking');
  const el = addMsg('', 'bot');
  let full = '';
  try{
    const r = await fetch('/api/chat_stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!r.ok||!r.body) throw new Error(r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,idx).trim(); buf=buf.slice(idx+2);
        if(!raw.startsWith('data: ')) continue;
        let ev; try{ev=JSON.parse(raw.slice(6));}catch{continue;}
        if(ev.type==='status'){setStatus(ev.text);}
        else if(ev.type==='token'){full+=ev.text; el.textContent=full; messages.scrollTop=messages.scrollHeight;}
        else if(ev.type==='done'){full=ev.reply||full; el.textContent=full;}
        else if(ev.type==='error'){el.textContent='Hata: '+ev.error;}
      }
    }
    if(!full) el.textContent='...';
    setOrb(''); setStatus('');
    if(ttsToggle.checked && full) speak(full);
  }catch(e){
    try{
      const r2=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      const j=await r2.json();
      el.textContent=j.reply||'...';
      if(ttsToggle.checked) speak(j.reply||'');
    }catch{el.textContent='Bağlantı hatası';}
    setOrb(''); setStatus('');
  }
}

function speak(text){
  const clean=(text||'').replace(/\[ACTION:[^\]]+\]/g,'').trim().slice(0,400);
  if(!clean) return;
  setOrb('speaking');
  fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean})})
    .then(r=>r.json()).then(j=>{
      if(!j.audio){fallbackSpeak(clean);return;}
      const bytes=Uint8Array.from(atob(j.audio),c=>c.charCodeAt(0));
      const a=new Audio(URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})));
      a.onended=()=>setOrb('');
      a.play().catch(()=>fallbackSpeak(clean));
    }).catch(()=>fallbackSpeak(clean));
}
function fallbackSpeak(t){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(t);
    u.lang='tr-TR';u.rate=1;
    u.onend=()=>setOrb('');
    speechSynthesis.speak(u);
  } else setOrb('');
}

btnSend.onclick=()=>sendText(input.value);
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendText(input.value);});

// Mic toggle (basit)
let micActive=false;
btnMic.onclick=()=>{
  micActive=!micActive;
  btnMic.classList.toggle('active',micActive);
  if(micActive){
    setOrb('listening');
    fetch('/api/wake',{method:'POST'}).then(r=>r.json()).then(j=>{
      if(j.wake&&j.text){addMsg('(ses) '+j.text,'user');sendText(j.text);}
      micActive=false;btnMic.classList.remove('active');setOrb('');
    }).catch(()=>{micActive=false;btnMic.classList.remove('active');setOrb('');});
  }
};

// Status fetch
async function fetchStatus(){
  try{
    const r=await fetch('/api/status');const j=await r.json();
    statusPill.textContent=`${j.stt} • ${j.tts} • ${j.llm}`;
  }catch{statusPill.textContent='bağlantı yok';}
}
fetchStatus(); setInterval(fetchStatus,10000);

// External wake (wake daemon'dan gelen)
window.ELISHA_EXTERNAL_WAKE = function(reason){
  setOrb('listening');
  addMsg('(uyanıyor...)', 'sys');
};

// Keep alive for auto-hide
setInterval(()=>{try{pywebview.api.keep_alive();}catch{}},5000);
</script>
</body>
</html>
