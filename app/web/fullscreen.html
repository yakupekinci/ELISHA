<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ELISHA — Fullscreen</title>
  <style>
    :root {
      --bg: #050508;
      --surface: oklch(0.22 0.02 275 / 0.45);
      --fg: oklch(0.96 0.01 275);
      --muted: oklch(0.72 0.02 275);
      --border: oklch(0.85 0.03 290 / 0.14);
      --accent: #7c3aed;
      --accent-soft: #a78bfa;
      --hot: #ff2e97;
      --status: #06b6d4;
      --orb-size: 168px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      cursor: default;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .stage:focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: -4px;
    }

    /* Ambient breath behind orb */
    .ambient {
      position: absolute;
      width: min(72vw, 520px);
      height: min(72vw, 520px);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 48%,
        oklch(0.45 0.18 293 / 0.28) 0%,
        oklch(0.35 0.14 293 / 0.12) 32%,
        transparent 68%
      );
      animation: ambient-breathe 4.8s ease-in-out infinite;
      transition: filter 0.5s ease, opacity 0.5s ease;
    }

    .stage[data-mode="listening"] .ambient {
      background: radial-gradient(
        circle at 50% 48%,
        oklch(0.55 0.22 330 / 0.38) 0%,
        oklch(0.45 0.18 293 / 0.2) 36%,
        transparent 70%
      );
      animation-duration: 1.6s;
      filter: saturate(1.35);
    }

    .stage[data-mode="speaking"] .ambient {
      background: radial-gradient(
        circle at 50% 48%,
        oklch(0.55 0.16 210 / 0.28) 0%,
        oklch(0.45 0.18 293 / 0.18) 38%,
        transparent 72%
      );
      animation-duration: 1.1s;
    }

    .stage[data-mode="thinking"] .ambient {
      animation-duration: 3.2s;
      opacity: 0.85;
    }

    @keyframes ambient-breathe {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* Close — invisible until hover near top-right */
    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 20;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: oklch(0.96 0.01 275 / 0);
      cursor: pointer;
      transition:
        color 0.25s ease,
        background 0.25s ease,
        opacity 0.25s ease;
      opacity: 0;
      pointer-events: auto;
    }

    .close-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
    }

    .stage:hover .close-btn,
    .close-btn:focus-visible {
      opacity: 1;
      color: oklch(0.78 0.02 275);
    }

    .close-btn:hover {
      color: var(--fg);
      background: oklch(1 0 0 / 0.06);
    }

    .close-btn:focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 2px;
      opacity: 1;
      color: var(--fg);
    }

    /* Orb assembly */
    .orb-system {
      position: relative;
      width: var(--orb-size);
      height: var(--orb-size);
      z-index: 2;
      animation: orb-float 5.2s ease-in-out infinite;
      pointer-events: none;
    }

    .stage[data-mode="listening"] .orb-system {
      animation: orb-float-listen 1.8s ease-in-out infinite;
    }

    .stage[data-mode="speaking"] .orb-system {
      animation: orb-float-speak 0.85s ease-in-out infinite;
    }

    .stage[data-mode="thinking"] .orb-system {
      animation: orb-float 4s ease-in-out infinite;
    }

    @keyframes orb-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes orb-float-listen {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.04); }
    }

    @keyframes orb-float-speak {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.06); }
    }

    /* Rotating dashed rings */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed oklch(0.7 0.08 293 / 0.22);
      pointer-events: none;
    }

    .ring-1 {
      inset: -28px;
      animation: ring-spin 28s linear infinite;
    }

    .ring-2 {
      inset: -48px;
      border-style: dashed;
      border-color: oklch(0.65 0.1 293 / 0.14);
      animation: ring-spin-rev 42s linear infinite;
      border-width: 1px;
      opacity: 0.85;
    }

    .ring-3 {
      inset: -72px;
      border-style: dotted;
      border-color: oklch(0.6 0.08 293 / 0.1);
      animation: ring-spin 56s linear infinite;
      opacity: 0.7;
    }

    .stage[data-mode="listening"] .ring {
      border-color: oklch(0.7 0.18 330 / 0.35);
      animation-duration: 12s;
    }

    .stage[data-mode="listening"] .ring-2 { animation-duration: 18s; }
    .stage[data-mode="listening"] .ring-3 { animation-duration: 24s; }

    .stage[data-mode="speaking"] .ring {
      border-color: oklch(0.7 0.12 210 / 0.3);
    }

    .stage[data-mode="speaking"] .ring-1 { animation-duration: 8s; }
    .stage[data-mode="speaking"] .ring-2 { animation-duration: 11s; }
    .stage[data-mode="speaking"] .ring-3 { animation-duration: 14s; }

    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes ring-spin-rev {
      to { transform: rotate(-360deg); }
    }

    /* Sphere body */
    .orb {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, oklch(0.42 0.08 293 / 0.55) 0%, transparent 42%),
        radial-gradient(circle at 62% 68%, oklch(0.28 0.1 293 / 0.45) 0%, transparent 48%),
        radial-gradient(circle at 50% 50%, #1a1428 0%, #0c0b12 55%, #06050a 100%);
      box-shadow:
        0 0 0 1px oklch(0.7 0.08 293 / 0.18) inset,
        0 0 40px oklch(0.45 0.18 293 / 0.35),
        0 0 80px oklch(0.4 0.16 293 / 0.18),
        0 18px 40px oklch(0 0 0 / 0.55);
      overflow: hidden;
      animation: orb-pulse 3.6s ease-in-out infinite;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: radial-gradient(
        circle at 40% 35%,
        oklch(0.55 0.2 293 / 0.22),
        transparent 65%
      );
      filter: blur(8px);
      pointer-events: none;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        145deg,
        oklch(1 0 0 / 0.12) 0%,
        transparent 38%,
        transparent 62%,
        oklch(0 0 0 / 0.35) 100%
      );
      pointer-events: none;
    }

    .stage[data-mode="listening"] .orb {
      animation: orb-pulse-listen 0.9s ease-in-out infinite;
      box-shadow:
        0 0 0 1px oklch(0.7 0.18 330 / 0.35) inset,
        0 0 50px oklch(0.55 0.22 330 / 0.5),
        0 0 100px oklch(0.5 0.2 293 / 0.35),
        0 18px 40px oklch(0 0 0 / 0.55);
    }

    .stage[data-mode="speaking"] .orb {
      animation: orb-pulse-speak 0.55s ease-in-out infinite;
      box-shadow:
        0 0 0 1px oklch(0.7 0.12 210 / 0.3) inset,
        0 0 48px oklch(0.55 0.14 210 / 0.4),
        0 0 90px oklch(0.45 0.18 293 / 0.28),
        0 18px 40px oklch(0 0 0 / 0.55);
    }

    .stage[data-mode="thinking"] .orb {
      animation: orb-pulse 2.4s ease-in-out infinite;
    }

    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    @keyframes orb-pulse-listen {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes orb-pulse-speak {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }

    /* Eyes */
    .eyes {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transform: translateY(-4px);
    }

    .eye {
      width: 36px;
      height: 36px;
      position: relative;
      display: grid;
      place-items: center;
      transform-origin: center;
      animation: eye-breathe 3.2s ease-in-out infinite;
      filter:
        drop-shadow(0 0 4px oklch(0.78 0.14 293 / 0.9))
        drop-shadow(0 0 12px oklch(0.65 0.2 293 / 0.55));
    }

    .eye-right {
      animation-delay: -1.1s;
    }

    .eye svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .eye .spray {
      fill: #f5f3ff;
      stroke: var(--accent-soft);
      stroke-width: 0.6;
      stroke-opacity: 0.55;
      paint-order: stroke fill;
      filter: url(#spray-blur);
    }

    .eye .mist {
      fill: var(--accent-soft);
      opacity: 0.35;
      filter: url(#spray-mist);
    }

    /* Idle pulse */
    @keyframes eye-breathe {
      0%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 0 3px oklch(0.78 0.14 293 / 0.75))
          drop-shadow(0 0 10px oklch(0.65 0.2 293 / 0.4));
      }
      50% {
        transform: scale(1.08);
        filter:
          drop-shadow(0 0 6px oklch(0.82 0.16 293 / 1))
          drop-shadow(0 0 18px oklch(0.68 0.22 293 / 0.65));
      }
    }

    /* Listening — grow + hot glow */
    .stage[data-mode="listening"] .eye {
      animation: eye-listen 1.1s ease-in-out infinite;
      filter:
        drop-shadow(0 0 6px oklch(0.7 0.22 330 / 1))
        drop-shadow(0 0 20px oklch(0.6 0.24 330 / 0.75));
    }

    .stage[data-mode="listening"] .eye .spray {
      fill: #fff;
      stroke: var(--hot);
    }

    .stage[data-mode="listening"] .eye .mist {
      fill: var(--hot);
      opacity: 0.45;
    }

    @keyframes eye-listen {
      0%, 100% { transform: scale(1.35); }
      50% { transform: scale(1.55); }
    }

    /* Speaking — morph X / + / * rhythm */
    .stage[data-mode="speaking"] .eye {
      animation: eye-speak 0.42s ease-in-out infinite;
      filter:
        drop-shadow(0 0 5px oklch(0.75 0.12 210 / 1))
        drop-shadow(0 0 16px oklch(0.6 0.16 210 / 0.65));
    }

    .stage[data-mode="speaking"] .eye-right {
      animation-delay: 0.12s;
    }

    .stage[data-mode="speaking"] .eye .spray {
      stroke: var(--status);
    }

    .stage[data-mode="speaking"] .eye .mist {
      fill: var(--status);
    }

    .stage[data-mode="speaking"] .glyph-x { animation: morph-x 0.42s steps(1) infinite; }
    .stage[data-mode="speaking"] .glyph-plus { animation: morph-plus 0.42s steps(1) infinite; }
    .stage[data-mode="speaking"] .glyph-star { animation: morph-star 0.42s steps(1) infinite; }

    @keyframes eye-speak {
      0% { transform: scale(1.15) rotate(-8deg); }
      25% { transform: scale(1.45) rotate(4deg); }
      50% { transform: scale(0.95) rotate(10deg); }
      75% { transform: scale(1.5) rotate(-5deg); }
      100% { transform: scale(1.15) rotate(-8deg); }
    }

    @keyframes morph-x {
      0%, 32% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }

    @keyframes morph-plus {
      0%, 32% { opacity: 0; }
      33%, 65% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }

    @keyframes morph-star {
      0%, 65% { opacity: 0; }
      66%, 100% { opacity: 1; }
    }

    .glyph-plus,
    .glyph-star {
      opacity: 0;
    }

    /* Thinking — slow spin, offset search */
    .stage[data-mode="thinking"] .eyes {
      gap: 34px;
      transform: translate(6px, -2px);
      transition: transform 0.6s ease, gap 0.6s ease;
    }

    .stage[data-mode="thinking"] .eye {
      animation: eye-think 2.8s linear infinite;
      filter:
        drop-shadow(0 0 5px oklch(0.75 0.16 293 / 0.9))
        drop-shadow(0 0 14px oklch(0.6 0.18 293 / 0.5));
    }

    .stage[data-mode="thinking"] .eye-right {
      animation: eye-think-offset 3.4s linear infinite;
      animation-direction: reverse;
    }

    @keyframes eye-think {
      from { transform: rotate(0deg) scale(1.05); }
      to { transform: rotate(360deg) scale(1.05); }
    }

    @keyframes eye-think-offset {
      0% { transform: rotate(0deg) translate(2px, -3px) scale(1.02); }
      50% { transform: rotate(180deg) translate(-3px, 2px) scale(1.1); }
      100% { transform: rotate(360deg) translate(2px, -3px) scale(1.02); }
    }

    /* Soft vignette — no UI */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 70% 60% at 50% 50%,
        transparent 40%,
        oklch(0.05 0.01 275 / 0.55) 100%
      );
      z-index: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient,
      .orb-system,
      .orb,
      .ring,
      .eye,
      .glyph-x,
      .glyph-plus,
      .glyph-star {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div
    class="stage"
    data-od-id="fullscreen-stage"
    data-mode="idle"
    role="application"
    aria-label="ELISHA fullscreen voice presence"
    tabindex="0"
  >
    <button
      type="button"
      class="close-btn"
      data-od-id="close-btn"
      aria-label="Close fullscreen"
      title="Close"
    >
      <svg viewBox="0 0 14 14" aria-hidden="true">
        <path d="M2 2l10 10M12 2L2 12" fill="none" />
      </svg>
    </button>

    <div class="vignette" aria-hidden="true"></div>
    <div class="ambient" data-od-id="ambient-glow" aria-hidden="true"></div>

    <div class="orb-system" data-od-id="orb-system">
      <div class="ring ring-1" aria-hidden="true"></div>
      <div class="ring ring-2" aria-hidden="true"></div>
      <div class="ring ring-3" aria-hidden="true"></div>

      <div class="orb" data-od-id="voice-orb" role="img" aria-label="ELISHA orb, idle">
        <!-- Shared spray filters -->
        <svg width="0" height="0" aria-hidden="true" style="position:absolute">
          <defs>
            <filter id="spray-blur" x="-40%" y="-40%" width="180%" height="180%">
              <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" seed="4" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="spray-mist" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.4" />
              <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" result="n" seed="9" />
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
        </svg>

        <div class="eyes" data-od-id="orb-eyes">
          <!-- Left eye -->
          <div class="eye eye-left" data-od-id="eye-left">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <!-- mist halo -->
              <g class="mist">
                <path d="M8 7 L11 9 L9 12 L7 10 Z" />
                <path d="M30 8 L33 10 L31 13 L28 11 Z" />
                <path d="M9 28 L12 30 L10 33 L7 31 Z" />
                <path d="M29 29 L32 31 L30 34 L27 32 Z" />
              </g>
              <!-- X -->
              <g class="glyph-x">
                <path class="spray" d="
                  M7.2 6.5
                  C8.1 5.9, 9.4 6.2, 10.2 7.1
                  L18.8 17.4
                  L28.1 6.8
                  C28.9 5.9, 30.2 5.7, 31.2 6.4
                  C32.3 7.2, 32.5 8.6, 31.6 9.6
                  L21.4 20.2
                  L32.0 31.0
                  C32.9 31.9, 32.8 33.4, 31.7 34.2
                  C30.7 34.9, 29.3 34.7, 28.5 33.8
                  L18.9 22.9
                  L9.8 33.6
                  C9.0 34.5, 7.5 34.6, 6.6 33.8
                  C5.6 32.9, 5.6 31.4, 6.5 30.5
                  L16.4 20.1
                  L6.8 9.4
                  C5.9 8.4, 6.2 7.1, 7.2 6.5 Z
                " />
              </g>
              <!-- + morph -->
              <g class="glyph-plus">
                <path class="spray" d="
                  M17.2 6.4
                  C17.8 5.6, 19.0 5.4, 19.9 6.0
                  C20.6 6.5, 21.0 7.4, 20.9 8.3
                  L20.4 16.8
                  L28.9 16.4
                  C30.1 16.3, 31.1 17.2, 31.1 18.4
                  C31.1 19.5, 30.2 20.5, 29.0 20.5
                  L20.5 20.9
                  L20.9 29.4
                  C21.0 30.6, 20.1 31.6, 18.9 31.6
                  C17.7 31.6, 16.8 30.7, 16.8 29.5
                  L16.4 21.0
                  L7.9 21.4
                  C6.7 21.5, 5.7 20.6, 5.7 19.4
                  C5.7 18.2, 6.6 17.3, 7.8 17.2
                  L16.3 16.8
                  L15.9 8.3
                  C15.8 7.4, 16.4 6.6, 17.2 6.4 Z
                " />
              </g>
              <!-- * morph -->
              <g class="glyph-star">
                <path class="spray" d="
                  M19.2 5.8 L21.0 14.2 L29.4 12.0 L23.0 18.2 L30.2 24.6
                  L21.4 22.4 L19.6 31.0 L17.8 22.4 L9.0 24.6 L16.2 18.2
                  L9.8 12.0 L18.2 14.2 Z
                " />
              </g>
            </svg>
          </div>

          <!-- Right eye -->
          <div class="eye eye-right" data-od-id="eye-right">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g class="mist">
                <path d="M7 8 L10 10 L8 13 L5 11 Z" />
                <path d="M31 7 L34 9 L32 12 L29 10 Z" />
                <path d="M8 29 L11 31 L9 34 L6 32 Z" />
                <path d="M30 28 L33 30 L31 33 L28 31 Z" />
              </g>
              <g class="glyph-x">
                <path class="spray" d="
                  M6.8 7.0
                  C7.6 6.1, 9.0 6.0, 9.9 7.0
                  L18.4 17.6

                  C8.6 34.9, 7.0 34.9, 6.1 33.9

                " />
              </g>
              <g class="glyph-plus">
                <path class="spray" d="
                  M17.0 6.2
                  C17.8 5.4, 19.1 5.3, 19.9 6.1
                  C20.5 6.7, 20.8 7.6, 20.7 8.5
                  L20.2 16.6
                  L28.7 16.2
                  C29.9 16.1, 30.9 17.0, 30.9 18.2
                  C30.9 19.4, 29.9 20.3, 28.7 20.3
                  L20.3 20.7
                  L20.7 29.2
                  C20.8 30.4, 19.9 31.4, 18.7 31.4
                  C17.5 31.4, 16.6 30.5, 16.6 29.3
                  L16.2 20.8
                  L7.7 21.2
                  C6.5 21.3, 5.5 20.4, 5.5 19.2
                  C5.5 18.0, 6.4 17.1, 7.6 17.0
                  L16.1 16.6
                  L15.7 8.1
                  C15.6 7.2, 16.2 6.4, 17.0 6.2 Z
                " />
              </g>
              <g class="glyph-star">
                <path class="spray" d="
                  M19.0 5.6 L20.9 14.0 L29.3 11.8 L22.8 18.0 L30.0 24.4
                  L21.2 22.2 L19.4 30.8 L17.6 22.2 L8.8 24.4 L16.0 18.0
                  L9.6 11.8 L18.0 14.0 Z
                " />
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var stage = document.querySelector("[data-od-id='fullscreen-stage']");
      var orb = document.querySelector("[data-od-id='voice-orb']");
      var closeBtn = document.querySelector("[data-od-id='close-btn']");
      var busy = false;

      function setMode(mode) {
        stage.setAttribute("data-mode", mode);
        orb.setAttribute("aria-label", "ELISHA orb, " + mode);
      }

      // Tıklama → gerçek dinleme başlat
      stage.addEventListener("click", function (e) {
        if (e.target.closest("[data-od-id='close-btn']")) return;
        if (busy) return;
        startListening();
      });

      stage.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (!busy) startListening();
        } else if (e.key === "Escape") {
          closeBtn.click();
        }
      });

      closeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        busy = false;
        setMode("idle");
        window.location.href = "/overlay.html";
      });

      function startListening() {
        busy = true;
        setMode("listening");
        fetch("/api/wake", {method: "POST"})
          .then(function(r) { return r.json(); })
          .then(function(j) {
            if (j.wake && j.text) {
              processCommand(j.text);
            } else {
              setMode("idle");
              busy = false;
            }
          }).catch(function() { setMode("idle"); busy = false; });
      }

      async function processCommand(text) {
        setMode("thinking");
        try {
          var r = await fetch("/api/chat_stream", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: text})
          });
          if (!r.ok || !r.body) throw new Error();
          var reader = r.body.getReader();
          var dec = new TextDecoder();
          var buf = "", full = "";
          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buf += dec.decode(chunk.value, {stream: true});
            var idx;
            while ((idx = buf.indexOf("\n\n")) >= 0) {
              var raw = buf.slice(0, idx).trim();
              buf = buf.slice(idx + 2);
              if (!raw.startsWith("data: ")) continue;
              try {
                var ev = JSON.parse(raw.slice(6));
                if (ev.type === "status") setMode("thinking");
                else if (ev.type === "token") full += ev.text;
                else if (ev.type === "done") full = ev.reply || full;
              } catch(e) {}
            }
          }
          if (full) {
            setMode("speaking");
            speak(full, function() { setMode("idle"); busy = false; });
          } else {
            setMode("idle"); busy = false;
          }
        } catch(e) {
          setMode("idle"); busy = false;
        }
      }

      function speak(text, onDone) {
        var clean = (text || "").replace(/\[ACTION:[^\]]+\]/g, "").trim().slice(0, 400);
        if (!clean) { onDone(); return; }
        fetch("/api/tts", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: clean})
        }).then(function(r) { return r.json(); })
        .then(function(j) {
          if (!j.audio) { fallbackSpeak(clean, onDone); return; }
          var bytes = Uint8Array.from(atob(j.audio), function(c) { return c.charCodeAt(0); });
          var a = new Audio(URL.createObjectURL(new Blob([bytes], {type: "audio/wav"})));
          a.onended = onDone;
          a.play().catch(function() { fallbackSpeak(clean, onDone); });
        }).catch(function() { fallbackSpeak(clean, onDone); });
      }

      function fallbackSpeak(t, onDone) {
        if ("speechSynthesis" in window) {
          var u = new SpeechSynthesisUtterance(t);
          u.lang = "tr-TR"; u.rate = 1;
          u.onend = onDone;
          speechSynthesis.speak(u);
        } else { onDone(); }
      }

      // Wake daemon tetik
      window.ELISHA_EXTERNAL_WAKE = function() { if (!busy) startListening(); };
      // Keep alive
      setInterval(function() { try { pywebview.api.keep_alive(); } catch(e) {} }, 5000);
    })();
  </script>
