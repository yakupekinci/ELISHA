<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>ELİŞA — Sesli Asistan HUD v6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2338e1ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --amb { syntax: '<color>'; inherits: true; initial-value: #38e1ff; }
@property --amplitude { syntax: '<number>'; inherits: true; initial-value: 0.4; }

:root{
  --bg:#050510;
  --bg2:#0a0e22;
  --panel:rgba(13,17,36,.55);
  --panel-brd:rgba(150,168,205,.16);
  --fg:#e8eefb;
  --muted:#9db0cc;
  --faint:#5f7090;
  --c-idle:#38e1ff;
  --c-listen:#5b8cff;
  --c-uspeak:#7cb2ff;
  --c-think:#a874ff;
  --c-tool:#3ce6a4;
  --c-speak:#ff6fb5;
  --c-err:#ff5964;
  --c-sleep:#5a6a88;
  --acc:var(--c-idle);
  --amplitude:.4;
  --orb:clamp(170px,26vh,280px);
  --fd:'Orbitron',sans-serif;
  --fb:'Rajdhani',system-ui,sans-serif;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  transition:--amb 1.6s ease,--acc .7s ease;
  -webkit-font-smoothing:antialiased;
}
body[data-state="idle"]{--acc:var(--c-idle);--amb:#0e7fa8}
body[data-state="listening"]{--acc:var(--c-listen);--amb:#1d54d8}
body[data-state="user-speaking"]{--acc:var(--c-uspeak);--amb:#2f6bff}
body[data-state="thinking"]{--acc:var(--c-think);--amb:#6d3bd8}
body[data-state="tool"]{--acc:var(--c-tool);--amb:#0d9c66}
body[data-state="speaking"]{--acc:var(--c-speak);--amb:#c73b86}
body[data-state="error"]{--acc:var(--c-err);--amb:#b81f30}
body[data-state="sleep"]{--acc:var(--c-sleep);--amb:#131a2e}

#ambient{
  position:fixed;inset:-28%;z-index:0;pointer-events:none;filter:blur(72px);
  background:
    radial-gradient(38% 34% at 50% 40%, color-mix(in oklab,var(--amb) 32%,transparent), transparent 70%),
    radial-gradient(26% 24% at 80% 90%, color-mix(in oklab,var(--amb) 15%,transparent), transparent 72%);
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;border-radius:50%;background:#cfe4ff;animation:tw linear infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(2,3,9,.78) 100%)}

header{
  position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
  padding:14px 22px 8px;
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand .bt{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.32em;color:var(--fg)}
.brand .bs{font-size:10.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin-top:2px}
.clock{text-align:center;line-height:1.15;min-width:190px}
.clock .t{font-family:var(--fd);font-weight:600;font-size:28px;letter-spacing:.14em;font-variant-numeric:tabular-nums;color:var(--fg);text-shadow:0 0 22px color-mix(in oklab,var(--acc) 35%,transparent)}
.clock .d{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:capitalize;margin-top:3px}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--panel-brd);backdrop-filter:blur(14px);
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--pc,#5f7090);box-shadow:0 0 8px var(--pc,#5f7090);flex:none}
.pill.ok{--pc:#3ce6a4}.pill.warn{--pc:#ffc857}.pill.err{--pc:#ff5964}
.pill.active{--pc:#38e1ff;animation:pillPulse 1.4s ease-in-out infinite}
@keyframes pillPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--pc) 45%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.pill .pv{color:var(--faint);text-transform:lowercase;letter-spacing:.05em}

main{position:relative;z-index:2;flex:1;min-height:0;display:grid;place-items:center;padding:4px 16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.orb-zone{position:relative;width:var(--orb);height:var(--orb)}
.orb-zone>*{position:absolute}
.aura{inset:-16%;border-radius:50%;
  background:radial-gradient(circle,color-mix(in oklab,var(--acc) 34%,transparent),transparent 62%);
  filter:blur(30px);animation:auraP 5s ease-in-out infinite}
@keyframes auraP{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.ring{inset:0}
.ring circle{fill:none;stroke:color-mix(in oklab,var(--acc) 62%,transparent);transition:stroke .7s ease}
.r1{animation:spin 26s linear infinite}
.r2{animation:spinRev 44s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.ripple{inset:0;border-radius:50%;border:1px solid color-mix(in oklab,var(--acc) 52%,transparent);
  opacity:0;pointer-events:none}
body[data-state="listening"] .ripple,body[data-state="user-speaking"] .ripple{opacity:1;animation:rip 2.6s cubic-bezier(.2,.6,.3,1) infinite}
body[data-state="user-speaking"] .ripple{animation-duration:1.6s}
.ripple:nth-child(2){animation-delay:.85s}
.ripple:nth-child(3){animation-delay:1.7s}
@keyframes rip{0%{transform:scale(.55);opacity:.75}100%{transform:scale(1.3);opacity:0}}
.orbit3d{inset:-6%;transform:rotateX(64deg);opacity:0;transition:opacity .5s ease;pointer-events:none}
body[data-state="thinking"] .orbit3d{opacity:1}
.orbA,.orbB{position:absolute;inset:0}
.orbA{animation:spin 8s linear infinite}
.orbB{animation:spinRev 13s linear infinite}
.orbit3d span{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;
  background:#d4b6ff;box-shadow:0 0 10px 2px rgba(168,116,255,.65)}
.orbA span:nth-child(1){transform:translate(-50%,-50%) rotate(0deg) translateX(calc(var(--orb)*.58))}
.orbA span:nth-child(2){transform:translate(-50%,-50%) rotate(120deg) translateX(calc(var(--orb)*.58))}
.orbA span:nth-child(3){transform:translate(-50%,-50%) rotate(240deg) translateX(calc(var(--orb)*.58))}
.orbB span:nth-child(1){transform:translate(-50%,-50%) rotate(60deg) translateX(calc(var(--orb)*.47))}
.orbB span:nth-child(2){transform:translate(-50%,-50%) rotate(240deg) translateX(calc(var(--orb)*.47))}
.toolring{inset:-4%;border-radius:50%;opacity:0;transition:opacity .4s ease;
  background:repeating-conic-gradient(var(--acc) 0 14deg,transparent 14deg 60deg);
  -webkit-mask:radial-gradient(closest-side,transparent 77%,#000 78%);
  mask:radial-gradient(closest-side,transparent 77%,#000 78%);
  animation:spin 1.5s linear infinite;pointer-events:none}
body[data-state="tool"] .toolring{opacity:.9}
.core{inset:9%;border-radius:50%;display:grid;place-items:center}
body[data-state="idle"] .core{animation:breathe 5s ease-in-out infinite}
body[data-state="listening"] .core{animation:corePulse 1.5s ease-in-out infinite}
body[data-state="user-speaking"] .core{animation:corePulse 1.1s ease-in-out infinite}
body[data-state="thinking"] .core{animation:sway 6s ease-in-out infinite}
body[data-state="error"] .orb-zone{animation:shake .5s ease}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.core-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:
    radial-gradient(circle at 33% 28%,rgba(255,255,255,.15),transparent 44%),
    radial-gradient(circle at 50% 56%, color-mix(in oklab,var(--acc) 24%,#0a0e22) 0%,#0a0e22 74%);
  border:1px solid color-mix(in oklab,var(--acc) 48%,transparent);
  box-shadow:0 0 46px color-mix(in oklab,var(--acc) 32%,transparent), inset 0 0 64px color-mix(in oklab,var(--acc) 16%,transparent);
  transform:scale(calc(1 + (var(--amplitude) - .2) * .035));
  transition:border-color .7s ease,box-shadow .7s ease}
body[data-state="speaking"] .core-in,body[data-state="user-speaking"] .core-in{
  filter:brightness(calc(.94 + (var(--amplitude) - .2) * .26))}
/* ── Robotik glyph gözler ── */
.eyes{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16%;
  font-family:var(--fd);transform:translate(var(--gx,0px),var(--gy,0px));
  transition:transform .7s cubic-bezier(.3,.7,.4,1)}
.eye{display:grid;place-items:center;min-width:.9em}
.glyph{font-size:clamp(24px,calc(var(--orb) * .13),42px);font-weight:700;line-height:1;
  color:var(--acc);letter-spacing:-.04em;
  text-shadow:0 0 16px color-mix(in oklab,var(--acc) 80%,transparent),
              0 0 44px color-mix(in oklab,var(--acc) 38%,transparent);
  transition:color .7s ease,opacity .5s ease,transform .14s ease}
body[data-state="sleep"] .glyph{opacity:.4}
body[data-state="error"] .glyph{animation:glyphShake .38s linear infinite}
@keyframes glyphShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
.wave{display:flex;align-items:center;gap:3px;height:46px;opacity:0;transition:opacity .35s ease}
body[data-state="speaking"] .wave{opacity:1}
.wave i{width:4px;height:100%;border-radius:3px;transform:scaleY(.12);transform-origin:center;
  background:linear-gradient(180deg,#ffd9ec,var(--c-speak) 46%,#7a3bff);
  box-shadow:0 0 8px rgba(255,111,181,.4)}
.state-label{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.42em;
  color:var(--acc);text-align:center;text-indent:.42em;
  text-shadow:0 0 18px color-mix(in oklab,var(--acc) 55%,transparent);
  transition:color .7s ease,text-shadow .7s ease}
.state-sub{font-size:13.5px;color:var(--muted);letter-spacing:.06em;text-align:center;margin-top:6px;max-width:min(520px,88vw)}

footer{position:relative;z-index:5;display:flex;justify-content:center;padding:6px 14px calc(14px + env(safe-area-inset-bottom))}
.chat-panel{width:min(780px,100%);display:flex;flex-direction:column;gap:10px}
.log{height:clamp(110px,22vh,208px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:12px 14px;background:var(--panel);border:1px solid var(--panel-brd);border-radius:18px;
  backdrop-filter:blur(18px);scrollbar-width:thin;scrollbar-color:color-mix(in oklab,var(--acc) 35%,transparent) transparent;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20px);
  mask-image:linear-gradient(180deg,transparent 0,#000 20px)}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--acc) 30%,transparent);border-radius:99px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:15.5px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:color-mix(in oklab,var(--c-listen) 20%,transparent);
  border:1px solid color-mix(in oklab,var(--c-listen) 45%,transparent);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.055);border:1px solid var(--panel-brd);
  border-bottom-left-radius:5px}
.msg .meta{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.08em;margin-top:4px;text-transform:uppercase}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--c-tool);
  background:color-mix(in oklab,var(--c-tool) 12%,transparent);
  border:1px solid color-mix(in oklab,var(--c-tool) 40%,transparent);
  padding:4px 11px;border-radius:999px;animation:pop .25s ease}
.chip svg{width:11px;height:11px}
.err-card{align-self:stretch;display:flex;gap:9px;align-items:center;color:#ffbcc1;
  background:color-mix(in oklab,var(--c-err) 13%,transparent);
  border:1px solid color-mix(in oklab,var(--c-err) 45%,transparent);
  border-radius:12px;padding:8px 12px;font-size:14px;animation:pop .25s ease}
.err-card svg{width:15px;height:15px;flex:none}
.sysline{align-self:center;font-size:11.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.clip-chip{align-self:flex-start;max-width:82%;background:rgba(13,17,36,.72);border:1px solid rgba(150,168,205,.22);border-radius:14px;padding:9px 12px;font-size:12px}
.cc-prev{color:var(--muted);line-height:1.4;margin-bottom:7px}
.cc-btns{display:flex;gap:6px;flex-wrap:wrap}
.cc-btns button{background:rgba(56,225,255,.12);border:1px solid rgba(56,225,255,.3);color:#8feaff;border-radius:11px;padding:3px 10px;font-size:11px;cursor:pointer}
.cc-btns button:hover{background:rgba(56,225,255,.22)}
.cc-x{background:none!important;border:1px solid transparent!important;color:var(--faint)!important}
.caret{display:inline-block;width:8px;height:.95em;vertical-align:-.12em;margin-left:3px;border-radius:1px;
  background:var(--c-speak);animation:caretB 1s steps(2) infinite}
@keyframes caretB{50%{opacity:0}}
.input-row{display:flex;gap:10px;align-items:center}
.input-row input{flex:1;min-width:0;height:48px;background:rgba(255,255,255,.05);
  border:1px solid var(--panel-brd);border-radius:14px;padding:0 16px;color:var(--fg);
  font-family:var(--fb);font-size:16.5px;letter-spacing:.02em;outline:none;transition:border-color .25s ease}
.input-row input::placeholder{color:var(--faint)}
.input-row input:focus-visible{border-color:color-mix(in oklab,var(--acc) 65%,transparent);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--acc) 22%,transparent)}
.btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--panel-brd);background:rgba(255,255,255,.05);color:#cfe0ff;flex:none;
  transition:background .25s ease,border-color .25s ease,transform .15s ease,filter .2s ease}
.btn svg{width:21px;height:21px}
.btn:hover{background:rgba(255,255,255,.1);border-color:color-mix(in oklab,var(--acc) 55%,transparent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.send-btn{background:var(--c-idle);border-color:transparent;color:#041019}
.send-btn:hover{background:#6ae9ff;filter:brightness(1.05)}
.mic-btn[aria-pressed="true"]{background:color-mix(in oklab,var(--c-listen) 30%,transparent);
  border-color:var(--c-listen);color:#eaf1ff;animation:pillPulse 1.6s infinite}

.settings-wrap{position:relative}
#gear-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;
  background:var(--panel);border:1px solid var(--panel-brd);backdrop-filter:blur(14px);color:var(--muted);
  cursor:pointer;transition:color .2s,border-color .2s,transform .3s}
#gear-btn:hover{color:var(--fg);border-color:color-mix(in oklab,var(--acc) 55%,transparent)}
#gear-btn.open{color:var(--acc);border-color:var(--acc)}
#gear-btn svg{width:16px;height:16px;transition:transform .35s ease}
#gear-btn.open svg{transform:rotate(90deg)}
#settings-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:50;min-width:230px;padding:14px;
  background:rgba(13,17,36,.92);border:1px solid var(--panel-brd);border-radius:14px;
  backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#settings-pop h4{margin:0 0 10px;font-family:var(--fd);font-size:11px;letter-spacing:.22em;
  color:var(--faint);text-transform:uppercase;font-weight:600}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;
  font-size:13.5px;color:var(--fg);cursor:pointer}
.set-row + .set-row{border-top:1px solid rgba(150,168,205,.1)}
.set-row input[type="checkbox"]{appearance:none;width:38px;height:21px;border-radius:999px;flex:none;
  background:rgba(95,112,144,.35);position:relative;cursor:pointer;transition:background .25s;margin:0}
.set-row input[type="checkbox"]::after{content:'';position:absolute;top:2.5px;left:3px;width:16px;height:16px;
  border-radius:50%;background:#cfdcf2;transition:left .25s,background .25s}
.set-row input[type="checkbox"]:checked{background:var(--c-idle)}
.set-row input[type="checkbox"]:checked::after{left:19px;background:#041019}
.set-row select,.set-row input[type="text"]{background:rgba(95,112,144,.25);border:1px solid var(--panel-brd);
  border-radius:8px;color:var(--fg);font-family:var(--fb);font-size:12.5px;padding:5px 8px;outline:none;
  max-width:130px}
.set-row input[type="range"]{width:110px;accent-color:var(--c-idle)}
.set-save{width:100%;margin-top:10px;padding:8px;border-radius:9px;border:1px solid transparent;
  background:var(--c-idle);color:#041019;font-family:var(--fd);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;transition:filter .2s}
.set-save:hover{filter:brightness(1.12)}
.win-controls{display:flex;gap:6px;margin-left:2px}
.win-controls button{width:26px;height:26px;border-radius:8px;border:1px solid var(--panel-brd);
  background:var(--panel);backdrop-filter:blur(14px);color:var(--muted);font-size:15px;line-height:1;
  cursor:pointer;transition:color .2s,border-color .2s;padding:0}
.win-controls button:hover{color:var(--fg);border-color:color-mix(in oklab,var(--acc) 55%,transparent)}
#win-close:hover{color:#ff5964;border-color:#ff5964}

::selection{background:color-mix(in oklab,var(--c-idle) 35%,transparent)}
noscript div{padding:24px;text-align:center;color:var(--muted)}
header.draggable{cursor:grab}
header.dragging{cursor:grabbing}

@media (max-width:760px){
  header{padding:12px 14px 6px;gap:10px 14px}
  .brand .bt{font-size:16px;letter-spacing:.24em}
  .clock{order:5;flex:1 0 100%;min-width:0}
  .clock .t{font-size:22px}
  .pill{padding:6px 9px;font-size:10px}
  .msg{max-width:88%}
}
@media (max-height:600px){
  .log{height:96px}
  .state-sub,.wave{display:none}
  .clock .t{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  body{transition-duration:.2s!important}
}
</style>
</head>
<body data-state="idle">
<div id="ambient" aria-hidden="true"></div>
<div id="stars" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>

<header data-od-id="app-header">
  <div class="brand" data-od-id="brand">
    <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <path d="M17 2.5 29.5 9.75v14.5L17 31.5 4.5 24.25V9.75Z" stroke="#38e1ff" stroke-opacity=".7" stroke-width="1.4"/>
      <circle cx="17" cy="17" r="5.2" fill="#38e1ff" fill-opacity=".9"/>
      <circle cx="17" cy="17" r="8.6" stroke="#38e1ff" stroke-opacity=".35" stroke-dasharray="2 4"/>
    </svg>
    <div>
      <div class="bt">ELİŞA</div>
      <div class="bs">Sesli Asistan · HUD v6</div>
    </div>
  </div>
  <div class="clock" data-od-id="clock">
    <div class="t" id="clock-time">--:--:--</div>
    <div class="d" id="clock-date">—</div>
  </div>
  <div class="pills" data-od-id="sys-pills" role="status" aria-label="Sistem durumu">
    <div class="pill warn" id="pill-stt" data-od-id="pill-stt"><span class="dot"></span><span>STT</span><span class="pv">bağlanıyor</span></div>
    <div class="pill" id="pill-tts" data-od-id="pill-tts"><span class="dot"></span><span>TTS</span><span class="pv">hazır</span></div>
    <div class="pill" id="pill-llm" data-od-id="pill-llm"><span class="dot"></span><span>LLM</span><span class="pv">hazır</span></div>
    <div class="win-controls">

      </button>

<noscript><div>Bu arayüz için JavaScript gerekli.</div></noscript>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const root = document.documentElement, body = document.body;
const els = {
  time: $('#clock-time'), date: $('#clock-date'),
  label: $('#state-label'), sub: $('#state-sub'),
  log: $('#chat-log'), input: $('#chat-input'), form: $('#chat-form'),
  mic: $('#mic-btn'),
  pSTT: $('#pill-stt'), pTTS: $('#pill-tts'), pLLM: $('#pill-llm'),
  eyes: $('#orb-eyes'), zone: $('#orb-zone')
};
const eyeL = $('#eye-l'), eyeR = $('#eye-r');

const ST = { IDLE:'idle', LISTEN:'listening', USPEAK:'user-speaking', THINK:'thinking',
             TOOL:'tool', SPEAK:'speaking', ERROR:'error', SLEEP:'sleep' };
const LABELS = { idle:'HAZIR', listening:'DİNLİYORUM', 'user-speaking':'KONUŞUYORSUN',
  thinking:'DÜŞÜNÜYORUM', tool:'ARAÇ ÇALIŞIYOR', speaking:'KONUŞUYORUM', error:'HATA', sleep:'UYKU MODU' };
const SUBS = { idle:'Uyandırma kelimesini bekliyorum', listening:'Konuşabilirsin — dinleme penceresi açık',
  'user-speaking':'Seni duyuyorum…', thinking:'Sorgun işleniyor', tool:'Harici araç çalıştırılıyor',
  speaking:'Yanıt veriyorum — söz almak için konuş', error:'Kısaca bekleyeceğim', sleep:'Uyanmak için yaz ya da uyandırma kelimesini söyle' };

let state = ST.IDLE, lastActivity = Date.now();
let followUpUntil = 0, stateTimer = null;
let chatAbort = null, chatTimeout = null, watchdog = null;
let curAiEl = null, curTxtEl = null, curText = '', caretEl = null, msgSeq = 0;
let speakMinUntil = 0, ttsSeen = false;
const seenKeys = new Set();

let ampTarget = .4, ampDisp = .4, simMode = false, simAnnounced = false;
let micFailStreak = 0, micLastOk = 0, micBusy = false;

function touch(){ lastActivity = Date.now(); }
function setPill(el, cls, val){
  el.classList.remove('ok','warn','err','active');
  if(cls) el.classList.add(cls);
  el.querySelector('.pv').textContent = val;
}
function pillCls(el, cls){
  el.classList.remove('ok','warn','err','active');
  if(cls) el.classList.add(cls);
}
function setState(s){
  touch();
  state = s;
  body.dataset.state = s;
  clearTimeout(stateTimer); stateTimer = null;
  els.label.textContent = LABELS[s] || s.toUpperCase();
  els.sub.textContent = SUBS[s] || '';
  els.mic.setAttribute('aria-pressed', String(s === ST.LISTEN || s === ST.USPEAK));
  if(s === ST.LISTEN){
    stateTimer = setTimeout(() => { if(state === ST.LISTEN) setState(ST.IDLE); }, 60000);
  } else if(s === ST.ERROR){
    stateTimer = setTimeout(() => { if(state === ST.ERROR) setState(ST.IDLE); }, 5000);
  } else if(s === ST.SPEAK){
    stateTimer = setTimeout(() => { if(state === ST.SPEAK) enterListen(); }, 120000);
  }
}
function enterListen(){
  followUpUntil = Date.now() + 60000;
  setState(ST.LISTEN);
}
async function jget(url, ms){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try{
    const r = await fetch(url, { signal:c.signal, cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

const BARN = 27;
const waveBox = $('#wave-bars');
const barEls = [], barSp = new Float32Array(BARN), barPh = new Float32Array(BARN), barVal = new Float32Array(BARN).fill(.12);
for(let i = 0; i < BARN; i++){
  const b = document.createElement('i');
  waveBox.appendChild(b);
  barEls.push(b); barSp[i] = 1.3 + Math.random()*2.3; barPh[i] = Math.random()*6.283;
}

const starsBox = $('#stars');
for(let i = 0; i < 80; i++){
  const s = document.createElement('i');
  const sz = (.8 + Math.random()*1.6).toFixed(1);
  s.style.cssText = `left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${sz}px;height:${sz}px;animation-duration:${(2.5+Math.random()*5).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s`;
  starsBox.appendChild(s);
}

const fmtT = new Intl.DateTimeFormat('tr-TR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
const fmtD = new Intl.DateTimeFormat('tr-TR', { day:'numeric', month:'long', year:'numeric', weekday:'long' });
function clockTick(){
  const n = new Date();
  els.time.textContent = fmtT.format(n);
  let d = fmtD.format(n);
  els.date.textContent = d.charAt(0).toLocaleUpperCase('tr') + d.slice(1);
}
clockTick(); setInterval(clockTick, 1000);

function nearBottom(){ return els.log.scrollHeight - els.log.scrollTop - els.log.clientHeight < 90; }
function scrollLog(force){ if(force || nearBottom()) els.log.scrollTop = els.log.scrollHeight; }
function trimLog(){ while(els.log.children.length > 80) els.log.firstChild.remove(); }
function nowHM(){ return new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }); }
function addUser(text){
  const m = document.createElement('div');
  m.className = 'msg user'; m.dataset.odId = 'msg-user-' + (++msgSeq);
  m.textContent = text;
  const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = nowHM();
  m.appendChild(meta);
  els.log.appendChild(m); trimLog(); scrollLog(true);
}
function addAi(){
  const m = document.createElement('div');
  m.className = 'msg ai'; m.dataset.odId = 'msg-elisha-' + (++msgSeq);
  curTxtEl = document.createTextNode('');
  m.appendChild(curTxtEl);
  caretEl = document.createElement('span'); caretEl.className = 'caret';
  m.appendChild(caretEl);
  els.log.appendChild(m); trimLog(); scrollLog(true);
  curAiEl = m; curText = '';
  return m;
}
function endAiBubble(){
  if(caretEl){ caretEl.remove(); caretEl = null; }
  const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = nowHM();
  curAiEl.appendChild(meta);
  scrollLog(true);
}
function addChip(label){
  const c = document.createElement('div');
  c.className = 'chip'; c.dataset.odId = 'chip-tool-' + (++msgSeq);
  c.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>';
  const t = document.createElement('span'); t.textContent = label || 'araç';
  c.appendChild(t);
  els.log.appendChild(c); trimLog(); scrollLog(true);
}
function addErr(msg){
  const e = document.createElement('div');
  e.className = 'err-card'; e.dataset.odId = 'err-card-' + (++msgSeq);
  e.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>';
  const t = document.createElement('span'); t.textContent = msg || 'Bilinmeyen hata';
  e.appendChild(t);
  els.log.appendChild(e); trimLog(); scrollLog(true);
}
function addSys(text){
  const s = document.createElement('div');
  s.className = 'sysline'; s.textContent = text;
  els.log.appendChild(s); trimLog(); scrollLog(false);
}

function clearChatTimers(){
  clearTimeout(chatTimeout); clearTimeout(watchdog);
  chatTimeout = watchdog = null;
}
function forceError(msg){
  if(chatAbort){ try{ chatAbort.abort(); }catch(e){} }
  chatAbort = null; clearChatTimers();
  if(caretEl && curAiEl) endAiBubble();
  setPill(els.pLLM, 'err', 'hata');
  addErr(msg);
  setState(ST.ERROR);
}
function startChat(text){
  if(chatAbort) return;
  setState(ST.THINK);
  setPill(els.pLLM, 'active', 'çalışıyor');
  addAi();
  chatAbort = new AbortController();
  const myAbort = chatAbort;
  chatTimeout = setTimeout(() => { try{ myAbort.abort(); }catch(e){} }, 70000);
  watchdog = setTimeout(() => {
    if(chatAbort === myAbort) forceError('Zaman aşımı — yanıt 75 sn içinde gelmedi');
  }, 75000);

  fetch('/api/chat_stream', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Accept':'text/event-stream' },
    body: JSON.stringify({ text }),
    signal: myAbort.signal
  }).then(async r => {
    if(!r.ok || !r.body) throw new Error('Sunucu yanıtı geçersiz (' + r.status + ')');
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for(;;){
      const { value, done } = await rd.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while((idx = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if(!line.startsWith('data:')) continue;
        let ev;
        try{ ev = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
        handleEvent(ev, myAbort);
      }
    }
    finishChat(null);
  }).catch(err => {
    if(myAbort.signal.aborted) finishChat(new Error('Zaman aşımı — bağlantı 70 sn içinde yanıt vermedi'));
    else finishChat(err);
  });
}
function handleEvent(ev, myAbort){
  if(!ev || chatAbort !== myAbort) return;
  const t = ev.type;
  if(t === 'status'){
    const lbl = String(ev.tool || ev.name || ev.detail || '').trim();
    setState(ST.TOOL);
    els.label.textContent = lbl ? ('ARAÇ · ' + lbl.toUpperCase()) : 'ARAÇ ÇALIŞIYOR';
    addChip(lbl || 'araç çalışıyor');
  } else if(t === 'token'){
    const tok = String(ev.token ?? ev.text ?? '');
    if(tok){
      if(state !== ST.SPEAK && state !== ST.TOOL) setState(ST.SPEAK);
      curText += tok;
      curTxtEl.textContent = curText;
      scrollLog(false);
    }
  } else if(t === 'done'){
    const rep = ev.reply != null ? String(ev.reply) : '';
    if(rep.length >= curText.length){ curText = rep; curTxtEl.textContent = curText; }
    finishChat(null);
  } else if(t === 'error'){
    finishChat(new Error(ev.message || 'Sunucu bir hata bildirdi'));
  }
}
function finishChat(err){
  const wasMine = chatAbort;
  if(!wasMine && !err) return;
  chatAbort = null;
  clearChatTimers();
  if(curAiEl && caretEl) endAiBubble();
  if(err){
    setPill(els.pLLM, 'err', 'hata');
    addErr(err.message || 'Bağlantı hatası');
    setState(ST.ERROR);
  } else {
    setPill(els.pLLM, 'ok', 'hazır');
    beginSpeak();
  }
}
function beginSpeak(){
  setState(ST.SPEAK);
  speakMinUntil = Date.now() + Math.min(22000, Math.max(2800, curText.length * 52));
  ttsSeen = false;
}
function bargeExit(){ enterListen(); }

async function micLoop(){
  if(micBusy || document.hidden) return;
  micBusy = true;
  try{
    const d = await jget('/api/mic_level', 900);
    const ts = Number(d && d.ts) || 0;
    const fresh = ts > 0 && (Date.now()/1000 - ts) < 1.5;
    const rms = Math.max(0, Number(d && d.rms) || 0);
    if(fresh){
      simMode = false; micFailStreak = 0; micLastOk = Date.now();
      ampTarget = Math.min(2, Math.max(.2, .25 + Math.sqrt(rms) * 2.6));
    } else {
      simMode = true;
      announceSim();
    }
  }catch(e){
    micFailStreak++;
    if(micFailStreak >= 4){ simMode = true; announceSim(); }
  }
  micBusy = false;
}
function announceSim(){
  if(simAnnounced) return;
  simAnnounced = true;
  addSys('Mikrofon verisi yok — simülasyon modu');
}
setInterval(micLoop, 100);

setInterval(() => {
  if(simMode) pillCls(els.pSTT, 'warn');
  else if(Date.now() - micLastOk < 2500) pillCls(els.pSTT, 'ok');
  else if(micFailStreak >= 8) pillCls(els.pSTT, 'err');
}, 500);

async function wakeLoop(){
  if(document.hidden) return;
  if(state !== ST.IDLE && state !== ST.LISTEN && state !== ST.SLEEP) return;
  if(state === ST.LISTEN && followUpUntil && Date.now() > followUpUntil){
    setState(ST.IDLE); return;
  }
  try{
    const d = await jget('/api/wake_check', 1400);
    if(!d || typeof d !== 'object') return;
    const txt = String(d.text || '').trim();
    if(!d.wake && !txt) return;
    const key = (d.ts != null ? 'ts' + d.ts : txt);
    if(seenKeys.has(key)) return;
    const allowed = state === ST.LISTEN ||
      ((d.wake === true || txt) && (state === ST.IDLE || state === ST.SLEEP));
    if(!allowed) return;
    seenKeys.add(key);
    if(seenKeys.size > 40){ seenKeys.delete(seenKeys.values().next().value); }
    touch();
    addSys('👋 Hey ELİŞA!');
    if(txt){ addUser(txt); startChat(txt); }
    else enterListen();
  }catch(e){}
}
setInterval(wakeLoop, 550);

async function bargeLoop(){
  if(document.hidden) return;
  try{
    const d = await jget('/api/barge', 1400);
    const speaking = !!(d && d.speaking);
    pillCls(els.pTTS, speaking ? 'active' : 'ok');
    if(state !== ST.SPEAK) return;
    if(d && d.barge === true){ bargeExit(); return; }
    if(speaking){
      ttsSeen = true;
      speakMinUntil = Math.max(speakMinUntil, Date.now() + 1400);
    } else if(Date.now() > speakMinUntil){
      bargeExit();
    }
  }catch(e){
    if(state === ST.SPEAK && Date.now() > speakMinUntil + 4000) bargeExit();
  }
}
setInterval(bargeLoop, 650);

setInterval(() => {
  if(state === ST.IDLE && Date.now() - lastActivity > 180000) setState(ST.SLEEP);
}, 5000);

/* ── Robotik glyph göz motoru ── durum + konuşma amplitüdüne göre karakter çifti */
const glyphL = $('#glyph-l'), glyphR = $('#glyph-r');
function setGlyphs(l, r, scale){
  const s = scale == null ? '' : 'scale(' + scale + ')';
  glyphL.textContent = l; glyphR.textContent = r;
  glyphL.style.transform = s; glyphR.style.transform = s;
}
let thinkFlip = false, speakStep = 0, nextBlink = Date.now() + 2600, blinkHold = 0, scanFlip = false;
const SPEAK_FRAMES = [
  ['<', '>'], ['>', '<'], ['*', '*'], ['.', '.'], ['*', '*'], ['<', '<'], ['>', '>']
];
setInterval(() => {
  if(document.hidden) return;
  const now = Date.now();
  if(state === ST.SLEEP){ setGlyphs('—', '—'); return; }
  if(state === ST.ERROR){ setGlyphs('×', '×'); return; }
  if(state === ST.THINK){
    if(now - (glyphTick.t0 || 0) > 620){ glyphTick.t0 = now; thinkFlip = !thinkFlip; }
    thinkFlip ? setGlyphs('>', '<') : setGlyphs('*', '*');
    return;
  }
  if(state === ST.SPEAK || state === ST.TOOL){
    speakStep = (speakStep + 1) % SPEAK_FRAMES.length;
    const f = SPEAK_FRAMES[speakStep];
    const boost = ampDisp > 1.15 ? 1.14 : (ampDisp > .65 ? 1 : .88);
    setGlyphs(f[0], f[1], boost);
    return;
  }
  if(state === ST.USPEAK){
    scanFlip = !scanFlip;
    setGlyphs(scanFlip ? '«' : '‹', scanFlip ? '»' : '›');
    return;
  }
  if(state === ST.LISTEN){
    if(now - (glyphTick.s0 || 0) > 950){ glyphTick.s0 = now; scanFlip = !scanFlip; }
    scanFlip ? setGlyphs('<', '<') : setGlyphs('>', '>');
    return;
  }
  // IDLE: • • ara ara kırpış _
  if(blinkHold > 0){ blinkHold -= 140; if(blinkHold <= 0) setGlyphs('•', '•'); return; }
  if(now > nextBlink){
    blinkHold = 300; nextBlink = now + 2400 + Math.random() * 3800;
    setGlyphs('_', '_');
  }
}, 140);
function glyphTick(){}  // zamanlayıcı hücreleri için taşıyıcı
glyphTick.t0 = 0; glyphTick.s0 = 0;

setInterval(() => {
  if((state === ST.IDLE || state === ST.LISTEN) && Math.random() < .55){
    els.eyes.style.setProperty('--gx', ((Math.random()*8)-4).toFixed(1) + 'px');
    els.eyes.style.setProperty('--gy', ((Math.random()*5)-2).toFixed(1) + 'px');
  }
}, 3200);

function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden) return;
  if(simMode){
    ampTarget = .45 + .22*Math.sin(t*.0021) + .06*Math.sin(t*.00057 + 1.7);
  }
  ampDisp += (ampTarget - ampDisp) * (ampTarget > ampDisp ? .35 : .12);
  ampDisp = Math.max(.05, Math.min(2.2, ampDisp));
  root.style.setProperty('--amplitude', ampDisp.toFixed(3));

  const active = state === ST.SPEAK;
  const norm = Math.max(0, Math.min(1, (ampDisp - .2) / 1.8));
  for(let i = 0; i < BARN; i++){
    let v;
    if(active){
      v = .12 + .88 * norm * (.35 + .65*Math.abs(Math.sin(t*.001*barSp[i] + barPh[i])));
    } else {
      v = barVal[i] * .82;
    }
    barVal[i] = v;
    barEls[i].style.transform = 'scaleY(' + v.toFixed(3) + ')';
  }

  if(state === ST.LISTEN && ampDisp > 1.02) setState(ST.USPEAK);
  else if(state === ST.USPEAK && ampDisp < .68) setState(ST.LISTEN);
}
requestAnimationFrame(frame);

els.form.addEventListener('submit', e => {
  e.preventDefault();
  touch();
  const v = els.input.value.trim();

  if(chatAbort){ els.input.value = ''; addSys('ELİŞA meşgul — yanıt bitince yazabilirsin'); return; }

  addUser(v);
  startChat(v);
});

});
async function refreshStatus(){
  try{
    const j = await jget('/api/status', 2500);
    if(j && j.stt) setPill(els.pSTT, simMode ? 'warn' : 'ok', String(j.stt));
    if(j && j.tts) setPill(els.pTTS, 'ok', String(j.tts));
    if(j && (j.llm || j.provider)){
      const p = String(j.provider || '');
      const label = p ? p + ' · ' + String(j.llm || '') : String(j.llm);
      setPill(els.pLLM, /^(groq|gemini|openrouter|cerebras|nvidia)$/i.test(p) ? 'ok' : '', label.slice(0, 22));
    }
    if(j && j.briefing && !refreshStatus._briefShown){
      refreshStatus._briefShown = true;
      addSys('🌅 ' + String(j.briefing).slice(0, 260));
    }
    if(j && Array.isArray(j.news) && j.news.length){
      addSys('🔔 ' + j.news.slice(0, 4).join(' · ').slice(0, 280));
    }
    if(j && j.clipboard && j.clipboard.text && !showClip._busy){
      showClip(String(j.clipboard.text));
    }
    refreshStatus._live = !!j.live;
  }catch(e){}
}
function showClip(text){
  const wrap = document.createElement('div');
  wrap.className = 'clip-chip';
  const prev = String(text).slice(0, 60).replace(/\s+/g,' ') + (String(text).length > 60 ? '…' : '');
  wrap.innerHTML = '<div class="cc-prev">📋 ' + prev.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>';
  const btns = document.createElement('div'); btns.className = 'cc-btns';
  [['Çevir','bu metni Türkçeye çevir'], ['Özetle','bu metni özetle'],
   ['Açıkla','bu metni açıkla'], ['Düzelt','bu metindeki yazım hatalarını düzelt']
  ].forEach(([lbl, cmd]) => {
    const b = document.createElement('button');
    b.textContent = lbl;
    b.onclick = () => { wrap.remove(); startChat(cmd + ': "' + text.slice(0,1200) + '"'); };
    btns.appendChild(b);
  });
  const x = document.createElement('button');
  x.textContent = '✕'; x.className = 'cc-x';
  x.onclick = () => wrap.remove();
  btns.appendChild(x);
  wrap.appendChild(btns);
  const logEl = $('#log'); if(logEl){ logEl.appendChild(wrap); logEl.scrollTop = logEl.scrollHeight; }
}
setInterval(refreshStatus, 20000);

let listenJobId = null, listenPoll = null;
function stopServerListen(){
  if(listenPoll){ clearInterval(listenPoll); listenPoll = null; }
  listenJobId = null;
}
async function startServerListen(){
  if(listenJobId) return;
  // Gemini Live: gerçek zamanlı ses oturumu (<1sn yanıt)
  if(refreshStatus._live){
    listenJobId = 'live';
    setState(ST.USPEAK);
    addSys('🔴 Canlı sohbet açıldı — bitirmek için "kapat kendini" de');
    try{
      await fetch('/api/live', { method:'POST' });
      // oturum bitene kadar izle
      while(listenJobId === 'live'){
        await new Promise(r => setTimeout(r, 1200));
        try{
          const s = await jget('/api/live/status', 3000);
          if(!s.active) break;
        }catch(e){ break; }
      }
      if(listenJobId === 'live') addSys('✅ Canlı oturum kapandı');
    }catch(e){ addSys('⚠️ Canlı oturum hatası'); }
    listenJobId = null;
    setState(ST.IDLE);
    return;
  }
  try{
    const r = await fetch('/api/listen', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ duration: 6 })
    });
    const j = await r.json();
    listenJobId = j.id;
    addSys('🎙 Dinliyorum — konuşabilirsin');
    const myJob = listenJobId;
    listenPoll = setInterval(async () => {
      try{
        const r2 = await fetch('/api/listen/result', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: myJob })
        });
        const res = await r2.json();
        if(!res || res.status !== 'done') return;
        stopServerListen();
        if(res.error){ addSys('⚠️ Mikrofon hatası: ' + res.error); setState(ST.IDLE); }
        else if(res.silent || !res.text){ addSys('🎙 Ses algılanamadı — tekrar dene'); setState(ST.IDLE); }
        else { addUser(res.text); startChat(res.text); }
      }catch(e){ stopServerListen(); setState(ST.IDLE); }
    }, 500);
  }catch(e){ addSys('⚠️ Dinleme başlatılamadı'); setState(ST.IDLE); }
}

gearBtn.addEventListener('click', async () => {

/* ── Pencere kontrolleri (gizle/kapat → menü çubuğunda yaşamaya devam) ── */
(function bindWin(attempt){
  const api = window.pywebview && window.pywebview.api;
  if(!api || !api.hide_app){
    if(attempt < 25) setTimeout(() => bindWin((attempt||0)+1), 400);
    return;

  $('#win-min').addEventListener('click', hide);
  $('#win-close').addEventListener('click', hide);
})();

/* ── Pencere sürükleme (frameless — başlık çubuğu yerine header) ── */
(function bindDrag(attempt){
  const api = window.pywebview && window.pywebview.api;
  if(!api || !api.drag){
    if(attempt < 25) setTimeout(() => bindDrag((attempt||0)+1), 400);
    return;
  }
  const hd = document.querySelector('header');
  hd.classList.add('draggable');
  let dragging = false, pendX = 0, pendY = 0, scheduled = false;
  function flush(){
    scheduled = false;
    const dx = pendX, dy = pendY; pendX = 0; pendY = 0;
    try{ api.drag(dx, dy); }catch(e){}
  }
  hd.addEventListener('pointerdown', e => {
    if(e.target.closest('.pills,#gear-btn,.settings-wrap,button,input,a')) return;
    dragging = true; hd.classList.add('dragging');
    bindDrag.lx = e.clientX; bindDrag.ly = e.clientY;
    try{ hd.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  hd.addEventListener('pointermove', e => {
    if(!dragging) return;
    pendX += e.clientX - bindDrag.lx; pendY += e.clientY - bindDrag.ly;
    bindDrag.lx = e.clientX; bindDrag.ly = e.clientY;
    if(!scheduled){ scheduled = true; requestAnimationFrame(flush); }
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false; bindDrag.lx = bindDrag.ly = 0;
    hd.classList.remove('dragging');
    try{ api.save_pos(); }catch(err){}
  }
  hd.addEventListener('pointerup', endDrag);
  hd.addEventListener('pointercancel', endDrag);
})();
