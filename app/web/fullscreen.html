<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ELISHA — Fullscreen HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050510;
      --bg-deep: #030308;
      --fg: #f4f8ff;
      --muted: oklch(0.72 0.04 230);
      --cyan: #00d4ff;
      --cyan-hot: #0ef;
      --blue: #2563eb;
      --green: #22c55e;
      --purple: #a855f7;
      --pink: #ec4899;
      --sphere-size: min(58vh, 620px);
      --hud-line: color-mix(in oklab, var(--cyan) 55%, transparent);
      --panel: color-mix(in oklab, #0a1020 78%, transparent);
      --font-display: "Orbitron", "Segoe UI", system-ui, sans-serif;
      --font-ui: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--fg);
      overflow: hidden;
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    /* ── Stage / space ── */
    .hud {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 70% at 50% 42%, oklch(0.22 0.08 260 / 0.55) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 78% 18%, oklch(0.28 0.12 280 / 0.28) 0%, transparent 50%),
        radial-gradient(ellipse 45% 35% at 18% 78%, oklch(0.2 0.1 230 / 0.22) 0%, transparent 55%),
        radial-gradient(circle at 50% 100%, oklch(0.18 0.06 250 / 0.35) 0%, transparent 40%),
        linear-gradient(180deg, #07071a 0%, var(--bg) 45%, #020208 100%);
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 8% 12%, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 22% 38%, #cdefff 99%, transparent),
        radial-gradient(1px 1px at 41% 18%, #fff 99%, transparent),
        radial-gradient(1px 1px at 63% 8%, #9fdfff 99%, transparent),
        radial-gradient(1.5px 1.5px at 78% 28%, #fff 99%, transparent),
        radial-gradient(1px 1px at 91% 14%, #fff 99%, transparent),
        radial-gradient(1px 1px at 14% 62%, #b8e8ff 99%, transparent),
        radial-gradient(1px 1px at 33% 81%, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 52% 71%, #fff 99%, transparent),
        radial-gradient(1px 1px at 69% 88%, #9fdfff 99%, transparent),
        radial-gradient(1px 1px at 86% 64%, #fff 99%, transparent),
        radial-gradient(1px 1px at 95% 92%, #fff 99%, transparent);
      opacity: 0.7;
    }

    .stars::before {
      content: "";
      transform: scale(1.15) translate(3%, -2%);
      opacity: 0.45;
      animation: twinkle 6s ease-in-out infinite;
    }

    .stars::after {
      content: "";
      transform: scale(0.92) translate(-4%, 5%);
      opacity: 0.35;
      animation: twinkle 9s ease-in-out infinite reverse;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.65; }
    }

    .debris {
      position: absolute;
      border-radius: 40% 60% 55% 45%;
      background: linear-gradient(135deg, #2a3348, #0d111a);
      box-shadow: inset 1px 1px 0 oklch(1 0 0 / 0.12), 0 0 12px oklch(0.5 0.08 230 / 0.25);
      pointer-events: none;
      opacity: 0.55;
      animation: drift 22s linear infinite;
    }

    .debris-1 { width: 18px; height: 14px; top: 18%; left: 62%; animation-duration: 28s; }
    .debris-2 { width: 11px; height: 9px; top: 72%; left: 28%; animation-duration: 34s; animation-delay: -8s; }
    .debris-3 { width: 8px; height: 7px; top: 34%; left: 78%; animation-duration: 40s; animation-delay: -14s; opacity: 0.4; }
    .debris-4 { width: 14px; height: 10px; top: 58%; left: 16%; animation-duration: 31s; animation-delay: -4s; }

    @keyframes drift {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(18px, -24px) rotate(40deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* ── Layout grid ── */
    .frame {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr minmax(200px, 260px);
      grid-template-rows: auto 1fr auto;
      width: 100%;
      height: 100%;
      padding: clamp(20px, 3vw, 40px);
      gap: clamp(12px, 2vw, 28px);
    }

    /* ── Top-left brand ── */
    .brand {
      grid-column: 1;
      grid-row: 1;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 280px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: clamp(28px, 3.2vw, 44px);
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.05;
      color: var(--fg);
      text-shadow: 0 0 24px color-mix(in oklab, var(--cyan) 35%, transparent);
      padding-right: 0.22em;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--green);
      text-transform: uppercase;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green), 0 0 20px color-mix(in oklab, var(--green) 50%, transparent);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.85); }
    }

    .diamonds {
      display: inline-flex;
      gap: 4px;
      margin-left: 2px;
    }

    .diamond {
      width: 5px;
      height: 5px;
      background: var(--cyan);
      transform: rotate(45deg);
      opacity: 0.85;
      box-shadow: 0 0 6px var(--cyan);
    }

    .prompt {
      font-family: var(--font-display);
      font-size: clamp(13px, 1.15vw, 16px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--cyan);
      text-transform: uppercase;
      text-shadow: 0 0 12px color-mix(in oklab, var(--cyan) 45%, transparent);
      min-height: 1.4em;
      transition: opacity 0.35s ease;
    }

    .wave-left {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 28px;
      margin-top: 2px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    .hud[data-state="listening"] .wave-left {
      opacity: 1;
      transform: translateY(0);
    }

    .wave-left span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--cyan-hot), var(--blue));
      box-shadow: 0 0 8px var(--cyan);
      animation: bar-bounce 0.9s ease-in-out infinite;
      height: 30%;
    }

    .wave-left span:nth-child(1) { animation-delay: 0s; height: 40%; }
    .wave-left span:nth-child(2) { animation-delay: 0.08s; height: 70%; }
    .wave-left span:nth-child(3) { animation-delay: 0.16s; height: 100%; }
    .wave-left span:nth-child(4) { animation-delay: 0.24s; height: 55%; }
    .wave-left span:nth-child(5) { animation-delay: 0.12s; height: 85%; }
    .wave-left span:nth-child(6) { animation-delay: 0.2s; height: 45%; }
    .wave-left span:nth-child(7) { animation-delay: 0.04s; height: 65%; }
    .wave-left span:nth-child(8) { animation-delay: 0.28s; height: 90%; }
    .wave-left span:nth-child(9) { animation-delay: 0.1s; height: 50%; }
    .wave-left span:nth-child(10) { animation-delay: 0.18s; height: 75%; }
    .wave-left span:nth-child(11) { animation-delay: 0.06s; height: 35%; }
    .wave-left span:nth-child(12) { animation-delay: 0.22s; height: 60%; }

    @keyframes bar-bounce {
      0%, 100% { transform: scaleY(0.35); opacity: 0.65; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* ── Left nav ── */
    .nav {
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 10px 14px 10px 12px;
      text-align: left;
      color: color-mix(in oklab, var(--cyan) 78%, white);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-left: 2px solid transparent;
      border-radius: 0 6px 6px 0;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .nav-item:hover {
      background: color-mix(in oklab, var(--cyan) 10%, transparent);
      color: var(--fg);
      border-left-color: color-mix(in oklab, var(--cyan) 45%, transparent);
    }

    .nav-item:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .nav-item.is-active {
      border-left-color: var(--cyan);
      background: color-mix(in oklab, var(--cyan) 12%, transparent);
      color: var(--cyan-hot);
      box-shadow: inset 0 0 20px color-mix(in oklab, var(--cyan) 8%, transparent);
      text-shadow: 0 0 10px color-mix(in oklab, var(--cyan) 40%, transparent);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Center sphere stage ── */
    .stage {
      grid-column: 2;
      grid-row: 1 / 4;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      pointer-events: none;
    }

    .stage-hit {
      position: absolute;
      inset: 18% 22%;
      border-radius: 50%;
      pointer-events: auto;
      cursor: pointer;
      z-index: 5;
      background: transparent;
    }

    .stage-hit:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 8px;
    }

    .sphere-wrap {
      position: relative;
      width: var(--sphere-size);
      height: var(--sphere-size);
      display: grid;
      place-items: center;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      animation: float-idle 5.5s ease-in-out infinite;
    }

    .hud[data-state="speaking"] .sphere-wrap {
      transform: rotate(-18deg) translate(12px, 8px) scale(0.98);
      animation: float-speak 3.2s ease-in-out infinite;
    }

    @keyframes float-idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @keyframes float-speak {
      0%, 100% { transform: rotate(-18deg) translate(12px, 8px) scale(0.98); }
      50% { transform: rotate(-14deg) translate(8px, -4px) scale(1); }
    }

    /* Energy aura */
    .aura {
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, transparent 42%, color-mix(in oklab, var(--cyan) 18%, transparent) 58%, transparent 72%),
        conic-gradient(from 0deg, transparent 0%, color-mix(in oklab, var(--cyan) 35%, transparent) 12%, transparent 22%, color-mix(in oklab, var(--blue) 30%, transparent) 38%, transparent 48%, color-mix(in oklab, var(--purple) 28%, transparent) 62%, transparent 74%, color-mix(in oklab, var(--cyan) 25%, transparent) 88%, transparent 100%);
      filter: blur(10px);
      opacity: 0.75;
      animation: aura-spin 14s linear infinite;
      mix-blend-mode: screen;
    }

    .hud[data-state="speaking"] .aura {
      inset: -24%;
      opacity: 1;
      filter: blur(12px) saturate(1.35);
      background:
        radial-gradient(circle at 50% 50%, transparent 38%, color-mix(in oklab, var(--pink) 22%, transparent) 55%, transparent 70%),
        conic-gradient(from 40deg, transparent 0%, color-mix(in oklab, var(--pink) 45%, transparent) 10%, transparent 20%, color-mix(in oklab, var(--purple) 40%, transparent) 35%, transparent 45%, color-mix(in oklab, var(--cyan) 35%, transparent) 60%, transparent 72%, color-mix(in oklab, var(--pink) 30%, transparent) 85%, transparent 100%);
      animation-duration: 7s;
    }

    @keyframes aura-spin {
      to { transform: rotate(360deg); }
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid color-mix(in oklab, var(--cyan) 28%, transparent);
      pointer-events: none;
      box-shadow: 0 0 20px color-mix(in oklab, var(--cyan) 12%, transparent);
    }

    .ring-a {
      inset: -6%;
      border-style: dashed;
      animation: spin 22s linear infinite;
    }

    .ring-b {
      inset: -14%;
      border-color: color-mix(in oklab, var(--blue) 30%, transparent);
      border-style: dotted;
      animation: spin-rev 32s linear infinite;
      opacity: 0.7;
    }

    .ring-c {
      inset: -22%;
      width: auto;
      height: auto;
      border-color: color-mix(in oklab, var(--purple) 22%, transparent);
      clip-path: polygon(0 18%, 100% 0, 100% 82%, 0 100%);
      animation: spin 40s linear infinite;
      opacity: 0.55;
    }

    .hud[data-state="speaking"] .ring {
      border-color: color-mix(in oklab, var(--pink) 40%, var(--cyan));
      box-shadow: 0 0 28px color-mix(in oklab, var(--pink) 25%, transparent);
    }

    .hud[data-state="speaking"] .ring-a { animation-duration: 10s; }
    .hud[data-state="speaking"] .ring-b { animation-duration: 14s; }
    .hud[data-state="speaking"] .ring-c { animation-duration: 18s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-rev { to { transform: rotate(-360deg); } }

    .swirl {
      position: absolute;
      width: 118%;
      height: 48%;
      left: -9%;
      top: 26%;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: color-mix(in oklab, var(--cyan) 55%, transparent);
      border-right-color: color-mix(in oklab, var(--blue) 35%, transparent);
      filter: blur(0.5px);
      opacity: 0.55;
      animation: swirl 8s linear infinite;
      pointer-events: none;
      box-shadow: 0 0 30px color-mix(in oklab, var(--cyan) 20%, transparent);
    }

    .swirl-2 {
      top: 38%;
      width: 108%;
      left: -4%;
      border-top-color: color-mix(in oklab, var(--purple) 40%, transparent);
      border-left-color: color-mix(in oklab, var(--cyan) 30%, transparent);
      animation-direction: reverse;
      animation-duration: 11s;
      opacity: 0.4;
    }

    .hud[data-state="speaking"] .swirl {
      opacity: 0.9;
      border-top-color: color-mix(in oklab, var(--pink) 70%, transparent);
      border-right-color: color-mix(in oklab, var(--purple) 55%, transparent);
      box-shadow: 0 0 40px color-mix(in oklab, var(--pink) 35%, transparent);
      animation-duration: 4.5s;
      filter: blur(0.2px) saturate(1.4);
    }

    .hud[data-state="speaking"] .swirl-2 {
      opacity: 0.75;
      animation-duration: 6s;
    }

    @keyframes swirl {
      to { transform: rotate(360deg) scaleX(1.05); }
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: -30%;
      pointer-events: none;
      opacity: 0.35;
      transition: opacity 0.5s ease;
    }

    .hud[data-state="speaking"] .particles { opacity: 0.9; }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: particle-float 4s ease-in-out infinite;
    }

    .hud[data-state="speaking"] .particle {
      background: var(--pink);
      box-shadow: 0 0 10px var(--pink);
    }

    .particle:nth-child(1) { left: 12%; top: 40%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 88%; top: 28%; animation-delay: -0.6s; }
    .particle:nth-child(3) { left: 70%; top: 78%; animation-delay: -1.2s; }
    .particle:nth-child(4) { left: 22%; top: 72%; animation-delay: -1.8s; }
    .particle:nth-child(5) { left: 48%; top: 8%; animation-delay: -0.3s; }
    .particle:nth-child(6) { left: 58%; top: 90%; animation-delay: -2.1s; }
    .particle:nth-child(7) { left: 5%; top: 55%; animation-delay: -1.5s; }
    .particle:nth-child(8) { left: 92%; top: 60%; animation-delay: -0.9s; }

    @keyframes particle-float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(10px, -18px) scale(1.4); opacity: 1; }
    }

    /* Sphere body */
    .sphere {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 22%, oklch(0.55 0.04 230 / 0.55) 0%, transparent 28%),
        radial-gradient(circle at 72% 30%, oklch(0.42 0.08 220 / 0.35) 0%, transparent 32%),
        radial-gradient(circle at 40% 70%, oklch(0.28 0.06 250 / 0.4) 0%, transparent 40%),
        radial-gradient(circle at 65% 78%, oklch(0.22 0.05 280 / 0.35) 0%, transparent 35%),
        radial-gradient(circle at 50% 48%, #1a1e2a 0%, #0c0e16 42%, #05060c 72%, #020205 100%);
      box-shadow:
        inset 0 0 60px oklch(0 0 0 / 0.85),
        inset 18px 12px 40px oklch(1 0 0 / 0.08),
        inset -20px -28px 50px oklch(0 0 0 / 0.65),
        0 0 0 1px color-mix(in oklab, var(--cyan) 22%, transparent),
        0 0 40px color-mix(in oklab, var(--cyan) 25%, transparent),
        0 0 100px color-mix(in oklab, var(--blue) 18%, transparent),
        0 30px 60px oklch(0 0 0 / 0.65);
      overflow: hidden;
      isolation: isolate;
    }

    .sphere::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        linear-gradient(125deg, oklch(1 0 0 / 0.18) 0%, transparent 28%, transparent 60%, oklch(0 0 0 / 0.45) 100%),
        repeating-linear-gradient(
          118deg,
          transparent 0 18px,
          oklch(0.7 0.04 230 / 0.04) 18px 19px
        );
      pointer-events: none;
      z-index: 1;
    }

    .sphere::after {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, oklch(0.45 0.1 220 / 0.2), transparent 62%);
      filter: blur(16px);
      pointer-events: none;
      z-index: 0;
    }

    .hud[data-state="speaking"] .sphere {
      box-shadow:
        inset 0 0 60px oklch(0 0 0 / 0.85),
        inset 18px 12px 40px oklch(1 0 0 / 0.08),
        inset -20px -28px 50px oklch(0 0 0 / 0.65),
        0 0 0 1px color-mix(in oklab, var(--pink) 35%, transparent),
        0 0 50px color-mix(in oklab, var(--pink) 30%, transparent),
        0 0 110px color-mix(in oklab, var(--purple) 28%, transparent),
        0 30px 60px oklch(0 0 0 / 0.65);
    }

    /* Crack / panel lines */
    .cracks {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.55;
    }

    .cracks path {
      fill: none;
      stroke: color-mix(in oklab, var(--cyan) 35%, #1a2030);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .plate {
      position: absolute;
      z-index: 2;
      border-radius: 40%;
      background: linear-gradient(160deg, oklch(0.28 0.03 240 / 0.35), oklch(0.12 0.02 250 / 0.15));
      border: 1px solid oklch(0.55 0.04 230 / 0.12);
      pointer-events: none;
    }

    .plate-1 { width: 22%; height: 16%; top: 14%; left: 18%; transform: rotate(-18deg); }
    .plate-2 { width: 18%; height: 12%; top: 18%; right: 16%; transform: rotate(22deg); }
    .plate-3 { width: 28%; height: 14%; bottom: 16%; left: 28%; transform: rotate(8deg); opacity: 0.7; }

    /* X eyes */
    .eyes {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: clamp(28px, 6vw, 56px);
      transition: gap 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }

    .hud[data-state="speaking"] .eyes {
      gap: clamp(18px, 3.5vw, 32px);
      transform: translate(-50%, -50%) scale(0.78);
    }

    .eye-x {
      width: clamp(58px, 9vw, 96px);
      height: clamp(58px, 9vw, 96px);
      position: relative;
      filter:
        drop-shadow(0 0 4px #fff)
        drop-shadow(0 0 8px var(--cyan-hot))
        drop-shadow(0 0 18px var(--cyan))
        drop-shadow(0 0 36px var(--cyan))
        drop-shadow(0 0 60px color-mix(in oklab, var(--cyan) 75%, transparent));
      transition: filter 0.5s ease, width 0.5s ease, height 0.5s ease;
      animation: eye-glow 2.4s ease-in-out infinite;
    }

    @keyframes eye-glow {
      0%, 100% {
        filter:
          drop-shadow(0 0 4px #fff)
          drop-shadow(0 0 8px var(--cyan-hot))
          drop-shadow(0 0 18px var(--cyan))
          drop-shadow(0 0 36px var(--cyan))
          drop-shadow(0 0 60px color-mix(in oklab, var(--cyan) 75%, transparent));
      }
      50% {
        filter:
          drop-shadow(0 0 6px #fff)
          drop-shadow(0 0 12px var(--cyan-hot))
          drop-shadow(0 0 28px var(--cyan))
          drop-shadow(0 0 48px var(--cyan))
          drop-shadow(0 0 80px color-mix(in oklab, var(--cyan) 85%, transparent));
      }
    }

    .hud[data-state="speaking"] .eye-x {
      width: clamp(40px, 5.5vw, 62px);
      height: clamp(40px, 5.5vw, 62px);
      animation: none;
      filter:
        drop-shadow(0 0 3px #fff)
        drop-shadow(0 0 8px var(--cyan))
        drop-shadow(0 0 16px color-mix(in oklab, var(--cyan) 70%, var(--pink)))
        drop-shadow(0 0 32px color-mix(in oklab, var(--pink) 55%, transparent));
    }

    .eye-x svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .eye-x path {
      fill: none;
      stroke: #00eaff;
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
      paint-order: stroke;
    }

    .eye-x path.eye-core {
      stroke: #e8fcff;
      stroke-width: 7;
    }

    .eye-link {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 4px;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      background: var(--cyan-hot);
      box-shadow:
        0 0 8px var(--cyan),
        0 0 18px var(--cyan);
      opacity: 0;
      transition: width 0.55s ease, opacity 0.4s ease;
      z-index: 3;
    }

    .hud[data-state="speaking"] .eye-link {
      width: clamp(28px, 4vw, 48px);
      opacity: 1;
    }

    /* ── Top-right status ── */
    .status-panel {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      align-self: start;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      min-width: 160px;
    }

    .status-label {
      font-family: var(--font-display);
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-transform: uppercase;
      text-shadow: 0 0 16px color-mix(in oklab, var(--cyan) 50%, transparent);
      padding-right: 0.2em;
    }

    .hud[data-state="speaking"] .status-label {
      color: var(--pink);
      text-shadow: 0 0 16px color-mix(in oklab, var(--pink) 55%, transparent);
    }

    .wave-right {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 3px;
      height: 36px;
      width: 120px;
    }

    .wave-right span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--cyan-hot), var(--blue));
      box-shadow: 0 0 8px var(--cyan);
      animation: bar-bounce 0.85s ease-in-out infinite;
      transform-origin: bottom center;
      height: 40%;
    }

    .hud[data-state="speaking"] .wave-right span {
      background: linear-gradient(180deg, #ff7ad9, var(--purple));
      box-shadow: 0 0 8px var(--pink);
      animation-duration: 0.55s;
    }

    .wave-right span:nth-child(1) { animation-delay: 0.05s; }
    .wave-right span:nth-child(2) { animation-delay: 0.15s; }
    .wave-right span:nth-child(3) { animation-delay: 0s; }
    .wave-right span:nth-child(4) { animation-delay: 0.22s; }
    .wave-right span:nth-child(5) { animation-delay: 0.1s; }
    .wave-right span:nth-child(6) { animation-delay: 0.28s; }
    .wave-right span:nth-child(7) { animation-delay: 0.08s; }
    .wave-right span:nth-child(8) { animation-delay: 0.18s; }
    .wave-right span:nth-child(9) { animation-delay: 0.02s; }
    .wave-right span:nth-child(10) { animation-delay: 0.25s; }
    .wave-right span:nth-child(11) { animation-delay: 0.12s; }
    .wave-right span:nth-child(12) { animation-delay: 0.2s; }
    .wave-right span:nth-child(13) { animation-delay: 0.06s; }
    .wave-right span:nth-child(14) { animation-delay: 0.16s; }

    /* ── Right readiness card ── */
    .ready-card {
      grid-column: 3;
      grid-row: 2;
      justify-self: end;
      align-self: start;
      margin-top: clamp(8px, 2vh, 24px);
      position: relative;
      width: min(220px, 100%);
      padding: 18px 16px 16px;
      background: var(--panel);
      border: 1px solid var(--hud-line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .ready-card::before,
    .ready-card::after,
    .bracket-bl,
    .bracket-br {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }

    .ready-card::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .ready-card::after {
      top: -1px;
      right: -1px;
      border-top: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .bracket-bl {
      bottom: -1px;
      left: -1px;
      border-bottom: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .bracket-br {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .face-badge {
      width: 44px;
      height: 28px;
      margin-bottom: 12px;
      display: grid;
      place-items: center;
      border: 1px solid var(--hud-line);
      background: color-mix(in oklab, var(--cyan) 8%, transparent);
    }

    .face-badge svg {
      width: 34px;
      height: 16px;
      overflow: visible;
    }

    .face-badge path {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 3.5;
      stroke-linecap: round;
    }

    .ready-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--fg);
      text-transform: uppercase;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .ready-sub {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Clock ── */
    .clock-panel {
      grid-column: 3;
      grid-row: 3;
      justify-self: end;
      align-self: end;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .clock-time {
      font-family: var(--font-display);
      font-size: clamp(42px, 5.5vw, 72px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--fg);
      text-shadow: 0 0 30px color-mix(in oklab, var(--cyan) 25%, transparent);
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      font-family: var(--font-display);
      font-size: clamp(12px, 1.1vw, 15px);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .clock-day {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Corner HUD marks */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.55;
    }

    .corner-tl { top: 12px; left: 12px; border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner-tr { top: 12px; right: 12px; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

    .hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: color-mix(in oklab, var(--muted) 70%, transparent);
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 960px) {
      .frame {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto auto;
        padding: 16px;
        gap: 12px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .brand { grid-column: 1; grid-row: 1; }
      .status-panel { grid-column: 1; grid-row: 2; justify-self: start; align-items: flex-start; }
      .stage { grid-column: 1; grid-row: 3; min-height: 48vh; }
      .nav {
        grid-column: 1;
        grid-row: 4;
        flex-direction: row;
        flex-wrap: wrap;
        align-self: stretch;
      }
      .nav-item { border-left: none; border-bottom: 2px solid transparent; padding: 10px 12px; }
      .nav-item.is-active { border-bottom-color: var(--cyan); border-left-color: transparent; }
      .ready-card { grid-column: 1; grid-row: 5; justify-self: stretch; width: 100%; margin-top: 0; }
      .clock-panel { grid-column: 1; grid-row: 5; justify-self: end; align-self: end; }
      :root { --sphere-size: min(48vh, 420px); }
      .hint { display: none; }
    }

    @media (max-width: 520px) {
      .brand-name { letter-spacing: 0.14em; }
      .nav-item { font-size: 12px; letter-spacing: 0.06em; min-height: 44px; }
      .clock-time { font-size: 36px; }
      .ready-card { max-width: 58%; }
    }
  </style>
</head>

  <script>
    (function () {
      var hud = document.getElementById("hud");
      var promptText = document.getElementById("promptText");
      var statusLabel = document.getElementById("statusLabel");
      var readyTitle = document.getElementById("readyTitle");
      var clockTime = document.getElementById("clockTime");
      var clockDate = document.getElementById("clockDate");
      var clockDay = document.getElementById("clockDay");
      var sphereToggle = document.getElementById("sphereToggle");
      var busy = false;

      var months = [
        "OCAK", "ŞUBAT", "MART", "NİSAN", "MAYIS", "HAZİRAN",
        "TEMMUZ", "AĞUSTOS", "EYLÜL", "EKİM", "KASIM", "ARALIK"
      ];
      var days = [
        "PAZAR", "PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ"
      ];

      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function updateClock() {
        var now = new Date();
        clockTime.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
        clockDate.textContent = now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
        clockDay.textContent = days[now.getDay()];
      }

      function setState(state, hint) {
        hud.setAttribute("data-state", state);
        if (state === "listening") {
          promptText.textContent = hint || "SENİ DİNLİYORUM";
          statusLabel.textContent = "DİNLİYOR";
          readyTitle.textContent = "KONUŞMAYA HAZIR";
        } else if (state === "speaking") {
          promptText.textContent = hint || "KONUŞUYORUM";
          statusLabel.textContent = "KONUŞUYORUM";
          readyTitle.textContent = "SENİ ANLIYORUM";
        } else {
          promptText.textContent = hint || "NE DÜŞÜNÜYORSUN?";
          statusLabel.textContent = "HAZIR";
          readyTitle.textContent = "BANA BİR ŞEY SÖYLE";
        }
      }

      // Küreye tıkla → gerçek dinleme başlat
      sphereToggle.addEventListener("click", function() {
        if (busy) return;
        startListening();
      });

      function startListening() {
        busy = true;
        setState("listening", "SENİ DİNLİYORUM");
        fetch("/api/wake", {method: "POST"})
          .then(function(r) { return r.json(); })
          .then(function(j) {
            if (j.wake && j.text) {
              processCommand(j.text);
            } else {
              setState("listening", "DUYAMADIM, TEKRAR SÖYLE");
              busy = false;
            }
          }).catch(function() { setState("listening"); busy = false; });
      }

      async function processCommand(text) {
        setState("speaking", "DÜŞÜNÜYORUM...");
        readyTitle.textContent = "DÜŞÜNÜYORUM";
        try {
          var r = await fetch("/api/chat_stream", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: text})
          });
          if (!r.ok || !r.body) throw new Error();
          var reader = r.body.getReader();
          var dec = new TextDecoder();
          var buf = "", full = "";
          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buf += dec.decode(chunk.value, {stream: true});
            var idx;
            while ((idx = buf.indexOf("\n\n")) >= 0) {
              var raw = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
              if (!raw.startsWith("data: ")) continue;
              try {
                var ev = JSON.parse(raw.slice(6));
                if (ev.type === "status") {
                  readyTitle.textContent = ev.text.toUpperCase();
                }
                else if (ev.type === "token") full += ev.text;
                else if (ev.type === "done") full = ev.reply || full;
              } catch(e) {}
            }
          }
          if (full) {
            setState("speaking", "KONUŞUYORUM");
            readyTitle.textContent = "SENİ ANLIYORUM";
            speak(full, function() {
              setState("listening", "NE DÜŞÜNÜYORSUN?");
              busy = false;
            });
          } else {
            setState("listening"); busy = false;
          }
        } catch(e) {
          setState("listening"); busy = false;
        }
      }

      function speak(text, onDone) {
        var clean = (text || "").replace(/\[ACTION:[^\]]+\]/g, "").trim().slice(0, 400);
        if (!clean) { onDone(); return; }
        fetch("/api/tts", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: clean})
        }).then(function(r) { return r.json(); })
        .then(function(j) {
          if (!j.audio) { fallbackSpeak(clean, onDone); return; }
          var bytes = Uint8Array.from(atob(j.audio), function(c) { return c.charCodeAt(0); });
          var a = new Audio(URL.createObjectURL(new Blob([bytes], {type: "audio/wav"})));
          a.onended = onDone;
          a.play().catch(function() { fallbackSpeak(clean, onDone); });
        }).catch(function() { fallbackSpeak(clean, onDone); });
      }

      function fallbackSpeak(t, onDone) {
        if ("speechSynthesis" in window) {
          var u = new SpeechSynthesisUtterance(t);
          u.lang = "tr-TR"; u.rate = 1;
          u.onend = onDone;
          speechSynthesis.speak(u);
        } else { onDone(); }
      }

      // Menü butonları
      document.querySelectorAll(".nav-item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".nav-item").forEach(function (el) {
            el.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          var action = btn.getAttribute("data-action");
          if (action === "voice") startListening();
        });
      });

      // Wake daemon tetik
      window.ELISHA_EXTERNAL_WAKE = function() { if (!busy) startListening(); };
      // Keep alive
      setInterval(function() { try { pywebview.api.keep_alive(); } catch(e) {} }, 5000);

      // ESC → gizle
      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
          try { pywebview.api.hide_app(); } catch(ex) {}
        }
      });

      // Sağ üst kapatma butonu
      var closeEl = document.getElementById("closeBtn") || document.querySelector("[data-od-id='close-btn']");
      if (closeEl) {
        closeEl.addEventListener("click", function(e) {
          e.stopPropagation();
          try { pywebview.api.hide_app(); } catch(ex) {}
        });
      }

      updateClock();
      setInterval(updateClock, 1000);
      setState("listening", "NE DÜŞÜNÜYORSUN?");
    })();
  </script>
</body>
</html>
