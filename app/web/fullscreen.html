<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ELISHA — HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ───────── TOKENS ───────── */
    :root {
      --bg:       #050510;
      --surface:  #0a0f1e;
      --panel:    rgba(8,13,28,0.82);
      --border:   rgba(0,212,255,0.12);
      --fg:       #f4f8ff;
      --muted:    #6e7ea0;
      --cyan:     #00d4ff;
      --cyan-hot: #0ef;
      --blue:     #2563eb;
      --green:    #22c55e;
      --purple:   #a855f7;
      --pink:     #ec4899;
      --red:      #ef4444;
      --sphere-size: min(52vh, 540px);
      --font-d:   "Orbitron", system-ui, sans-serif;
      --font-ui:  "Rajdhani", system-ui, sans-serif;
      /* Eye per-state colors */
      --eye-color: var(--cyan);
      --eye-glow:  var(--cyan);
      /* Audio amplitude (set by JS) */
      --amplitude: 1;
    }

    /* ───────── RESET ───────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    input, textarea { font: inherit; }

    /* ───────── WINDOW CHROME ───────── */
    .win-chrome {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      z-index: 100;
      background: rgba(3,3,12,0.7);
      border-bottom: 1px solid rgba(0,212,255,0.08);
      -webkit-app-region: drag;
    }

    .win-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    .win-btn {
      width: 13px; height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      color: transparent;
      transition: color 0.15s;
      -webkit-app-region: no-drag;
    }
    .win-btn:hover { color: rgba(0,0,0,0.7); }

    .win-close    { background: #ff5f57; box-shadow: 0 0 8px rgba(255,95,87,0.4); }
    .win-minimize { background: #ffbd2e; box-shadow: 0 0 8px rgba(255,189,46,0.4); }

    .win-title {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      color: rgba(0,212,255,0.6);
      flex: 1;
      text-align: center;
      pointer-events: none;
    }

    .win-pills {
      display: flex;
      gap: 5px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    .wpill {
      font-family: var(--font-d);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(0,212,255,0.15);
      color: var(--muted);
      transition: color 0.2s, border-color 0.2s;
    }
    .wpill.ok  { color: var(--green); border-color: rgba(34,197,94,0.35); }
    .wpill.on  { color: var(--cyan); border-color: rgba(0,212,255,0.35); }

    /* ───────── HUD ROOT ───────── */
    .hud {
      position: relative;
      width: 100%;
      height: 100%;
      padding-top: 36px;   /* clear chrome */
      overflow: hidden;
      background:
        radial-gradient(ellipse 85% 65% at 50% 44%, rgba(24,38,80,0.55) 0%, transparent 55%),
        radial-gradient(ellipse 45% 35% at 78% 18%, rgba(32,18,90,0.3) 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 18% 78%, rgba(12,28,60,0.22) 0%, transparent 55%),
        linear-gradient(180deg, #07071a 0%, #050510 50%, #020208 100%);
    }

    /* ───────── STARS ───────── */
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 8% 12%, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 22% 38%, #cdefff 99%, transparent),
        radial-gradient(1px 1px at 41% 18%, #fff 99%, transparent),
        radial-gradient(1px 1px at 63% 8%, #9fdfff 99%, transparent),
        radial-gradient(1.5px 1.5px at 78% 28%, #fff 99%, transparent),
        radial-gradient(1px 1px at 91% 14%, #fff 99%, transparent),
        radial-gradient(1px 1px at 14% 62%, #b8e8ff 99%, transparent),
        radial-gradient(1px 1px at 33% 81%, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 52% 71%, #fff 99%, transparent),
        radial-gradient(1px 1px at 69% 88%, #9fdfff 99%, transparent),
        radial-gradient(1px 1px at 86% 64%, #fff 99%, transparent);
      opacity: 0.6;
      animation: star-twinkle 7s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes star-twinkle {
      0%   { opacity: 0.45; }
      100% { opacity: 0.72; }
    }

    /* ───────── CORNER MARKS ───────── */
    .corner {
      position: absolute;
      width: 22px; height: 22px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.4;
    }
    .corner-tl { top: 46px; left: 10px; border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner-tr { top: 46px; right: 10px; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
    .corner-bl { bottom: 10px; left: 10px; border-bottom: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner-br { bottom: 10px; right: 10px; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

    /* ───────── RESIZE GRIP ───────── */
    .resize-grip {
      position: fixed;
      bottom: 0; right: 0;
      width: 20px; height: 20px;
      cursor: se-resize;
      z-index: 200;
      opacity: 0.45;
      background:
        linear-gradient(135deg, transparent 40%, var(--cyan) 40%, var(--cyan) 43%, transparent 43%),
        linear-gradient(135deg, transparent 53%, var(--cyan) 53%, var(--cyan) 56%, transparent 56%),
        linear-gradient(135deg, transparent 66%, var(--cyan) 66%, var(--cyan) 69%, transparent 69%);
      transition: opacity 0.2s;
    }
    .resize-grip:hover { opacity: 0.9; }

    /* ───────── LAYOUT FRAME ───────── */
    .frame {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: clamp(200px,22vw,280px) 1fr clamp(180px,20vw,250px);
      grid-template-rows: 1fr;
      height: calc(100% - 36px);   /* minus chrome */
      padding: clamp(14px,2vw,28px);
      gap: clamp(10px,1.5vw,20px);
      contain: layout;
    }

    /* ───────── LEFT COLUMN ───────── */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    /* Brand header */
    .brand {
      flex-shrink: 0;
    }

    .brand-name {
      font-family: var(--font-d);
      font-size: clamp(24px,2.8vw,40px);
      font-weight: 700;
      letter-spacing: 0.24em;
      line-height: 1.05;
      text-shadow: 0 0 20px rgba(0,212,255,0.3);
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--green);
      text-transform: uppercase;
      margin-top: 6px;
    }

    .online-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 16px rgba(34,197,94,0.4);
      animation: dot-pulse 2s ease-in-out infinite;
    }

    @keyframes dot-pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.7; transform: scale(0.85); }
    }

    .prompt {
      font-family: var(--font-d);
      font-size: clamp(12px,1.1vw,15px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--cyan);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,212,255,0.4);
      margin-top: 8px;
      min-height: 1.4em;
      transition: color 0.4s;
    }

    /* Listening wave indicator */
    .wave-left {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    .hud[data-state="listening"] .wave-left,
    .hud[data-state="user-speaking"] .wave-left {
      opacity: 1;
      transform: translateY(0);
    }

    .wave-left span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--cyan-hot), var(--blue));
      box-shadow: 0 0 6px var(--cyan);
      animation: bar-bounce 0.9s ease-in-out infinite;
      height: 30%;
    }
    .wave-left span:nth-child(1)  { animation-delay:  0.00s; height: 40%; }
    .wave-left span:nth-child(2)  { animation-delay:  0.08s; height: 70%; }
    .wave-left span:nth-child(3)  { animation-delay:  0.16s; height:100%; }
    .wave-left span:nth-child(4)  { animation-delay:  0.24s; height: 55%; }
    .wave-left span:nth-child(5)  { animation-delay:  0.12s; height: 85%; }
    .wave-left span:nth-child(6)  { animation-delay:  0.20s; height: 45%; }
    .wave-left span:nth-child(7)  { animation-delay:  0.04s; height: 65%; }
    .wave-left span:nth-child(8)  { animation-delay:  0.28s; height: 90%; }
    .wave-left span:nth-child(9)  { animation-delay:  0.10s; height: 50%; }
    .wave-left span:nth-child(10) { animation-delay:  0.18s; height: 75%; }

    @keyframes bar-bounce {
      0%,100% { transform: scaleY(0.3); opacity: 0.6; }
      50%      { transform: scaleY(1);   opacity: 1;   }
    }

    /* ───────── SIDENAV ───────── */
    .sidenav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: rgba(0,212,255,0.65);
      border-left: 2px solid transparent;
      border-radius: 0 6px 6px 0;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(0,212,255,0.08);
      color: var(--fg);
      border-left-color: rgba(0,212,255,0.35);
    }

    .nav-item.is-active {
      background: rgba(0,212,255,0.1);
      border-left-color: var(--cyan);
      color: var(--cyan-hot);
      box-shadow: inset 0 0 16px rgba(0,212,255,0.06);
    }

    .nav-icon {
      width: 16px; height: 16px;
      flex-shrink: 0;
    }
    .nav-icon svg {
      width: 100%; height: 100%;
      fill: none; stroke: currentColor;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ───────── CONTENT PANELS ───────── */
    .panels {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .cpanel {
      display: none;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      overflow-y: auto;
    }
    .cpanel::-webkit-scrollbar { width: 3px; }
    .cpanel::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }

    .cpanel.is-active { display: flex; }

    /* Voice panel: mini chat log */
    .mini-chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .mini-chat::-webkit-scrollbar { width: 3px; }
    .mini-chat::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.25); border-radius: 3px; }

    .msg {
      max-width: 100%;
      font-size: 12px;
      line-height: 1.5;
      padding: 8px 10px;
      animation: msg-in 0.3s ease both;
    }
    @keyframes msg-in {
      from { opacity:0; transform: translateY(6px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border-radius: 10px 10px 3px 10px;
      color: #fff;
      font-weight: 500;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.12);
      border-radius: 10px 10px 10px 3px;
      color: var(--fg);
    }
    .msg .meta {
      display: block;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.65;
      font-family: var(--font-d);
    }
    .msg.sys {
      align-self: center;
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      background: none; border: none; padding: 2px;
    }

    /* Voice input bar */
    .voice-input {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(0,212,255,0.1);
    }

    .text-in {
      flex: 1;
      height: 36px;
      padding: 0 10px;
      background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 8px;
      color: var(--fg);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .text-in::placeholder { color: var(--muted); }
    .text-in:focus { border-color: rgba(0,212,255,0.45); background: rgba(0,212,255,0.1); }

    .ic-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.2);
      background: rgba(0,212,255,0.08);
      color: var(--cyan);
      font-size: 14px;
      display: grid;
      place-items: center;
      transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
      flex-shrink: 0;
    }
    .ic-btn:hover  { background: rgba(0,212,255,0.18); border-color: rgba(0,212,255,0.4); }
    .ic-btn.active { background: linear-gradient(135deg,#ff2e97,#ec4899); border-color: transparent; color:#fff; box-shadow: 0 0 14px rgba(255,46,151,0.5); }
    .ic-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }

    /* Files panel */
    .file-btns { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .file-btn {
      padding: 6px 12px;
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--cyan);
      text-transform: uppercase;
      transition: background 0.15s;
    }
    .file-btn:hover { background: rgba(0,212,255,0.12); }

    .file-list { font-size: 12px; color: var(--muted); line-height: 2; }
    .file-list .fitem {
      display: flex; gap: 8px; align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .file-list .fitem:hover { background: rgba(0,212,255,0.08); color: var(--fg); }

    /* Search panel */
    .search-bar {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .search-bar input {
      flex: 1;
      height: 34px;
      padding: 0 10px;
      background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 6px;
      color: var(--fg);
      font-size: 12px;
      outline: none;
    }
    .search-bar input:focus { border-color: rgba(0,212,255,0.4); }
    .search-btn { padding: 0 12px; height: 34px; border-radius: 6px; background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3); color: var(--cyan); font-size: 12px; font-weight: 600; }

    .search-result { font-size: 12px; color: var(--muted); line-height: 1.8; padding: 4px 0; border-bottom: 1px solid rgba(0,212,255,0.07); }

    /* Settings panel */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,212,255,0.07);
    }
    .setting-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .toggle-sw {
      width: 34px; height: 18px;
      border-radius: 999px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-sw::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-sw.on { background: rgba(0,212,255,0.25); border-color: rgba(0,212,255,0.5); }
    .toggle-sw.on::after { transform: translateX(16px); background: var(--cyan); }

    /* Settings select & range */
    .setting-select {
      background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
      color: var(--fg); border-radius: 6px; padding: 4px 8px; font-size: 11px;
      font-family: var(--font-ui); cursor: pointer; outline: none;
    }
    .setting-select:focus { border-color: var(--cyan); }
    .setting-range { width: 80px; accent-color: var(--cyan); cursor: pointer; }
    .setting-val { font-size: 11px; color: var(--cyan); min-width: 24px; text-align: center; }

    /* System panel */
    .sys-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(0,212,255,0.07); font-size: 12px; }
    .sys-key { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .sys-val { color: var(--fg); }

    /* ───────── CENTER: SPHERE STAGE ───────── */
    .sphere-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      contain: layout paint;
    }

    .sphere-hit {
      position: absolute;
      inset: 20% 20%;
      border-radius: 50%;
      z-index: 10;
      background: transparent;
    }
    .sphere-hit:focus-visible { outline: 2px solid var(--cyan); outline-offset: 8px; }

    .sphere-wrap {
      position: relative;
      width: var(--sphere-size);
      height: var(--sphere-size);
      display: grid;
      place-items: center;
      animation: float-idle 5.5s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes float-idle {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .hud[data-state="speaking"] .sphere-wrap,
    .hud[data-state="elisha-speaking"] .sphere-wrap {
      animation: float-speak 3s ease-in-out infinite;
    }

    @keyframes float-speak {
      0%,100% { transform: rotate(-14deg) translate(10px,6px) scale(0.99); }
      50%      { transform: rotate(-10deg) translate(6px,-4px) scale(1.01); }
    }

    /* Aura */
    .aura {
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 42%, rgba(0,212,255,0.15) 57%, transparent 72%),
        conic-gradient(from 0deg,
          transparent 0%, rgba(0,212,255,0.3) 12%, transparent 22%,
          rgba(37,99,235,0.25) 38%, transparent 48%,
          rgba(168,85,247,0.22) 62%, transparent 74%,
          rgba(0,212,255,0.2) 88%, transparent 100%);
      filter: blur(10px);
      opacity: 0.7;
      animation: aura-spin 16s linear infinite;
      will-change: transform;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .hud[data-state="speaking"]       .aura,
    .hud[data-state="elisha-speaking"].aura {
      inset: -24%;
      opacity: 1;
      filter: blur(12px) saturate(1.4);
      background:
        radial-gradient(circle, transparent 38%, rgba(236,72,153,0.2) 54%, transparent 70%),
        conic-gradient(from 40deg,
          transparent 0%, rgba(236,72,153,0.42) 10%, transparent 20%,
          rgba(168,85,247,0.38) 35%, transparent 45%,
          rgba(0,212,255,0.3) 60%, transparent 72%,
          rgba(236,72,153,0.28) 85%, transparent 100%);
      animation-duration: 8s;
    }

    @keyframes aura-spin { to { transform: rotate(360deg); } }

    /* Rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.22);
      pointer-events: none;
      box-shadow: 0 0 16px rgba(0,212,255,0.08);
      will-change: transform;
    }
    .ring-a { inset: -5%;  border-style: dashed;  animation: spin 22s linear infinite; }
    .ring-b { inset: -14%; border-style: dotted; border-color: rgba(37,99,235,0.25); animation: spin-rev 32s linear infinite; opacity: 0.65; }

    .hud[data-state="thinking"] .ring-a { animation-duration: 8s; border-color: rgba(168,85,247,0.4); }
    .hud[data-state="tool"]     .ring-a { animation-duration: 5s; border-color: rgba(34,197,94,0.5); }

    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes spin-rev { to { transform: rotate(-360deg); } }

    /* Swirl */
    .swirl {
      position: absolute;
      width: 118%; height: 46%;
      left: -9%; top: 27%;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(0,212,255,0.5);
      border-right-color: rgba(37,99,235,0.3);
      filter: blur(0.4px);
      opacity: 0.5;
      animation: swirl-spin 9s linear infinite;
      pointer-events: none;
      will-change: transform;
    }
    @keyframes swirl-spin { to { transform: rotate(360deg) scaleX(1.04); } }

    /* Particles (6 only, CSS transform - GPU) */
    .particles {
      position: absolute;
      inset: -28%;
      pointer-events: none;
      opacity: 0.3;
      transition: opacity 0.5s;
    }
    .hud[data-state="speaking"]       .particles,
    .hud[data-state="elisha-speaking"].particles { opacity: 0.85; }
    .hud[data-state="thinking"]        .particles { opacity: 0.7; }

    .pt {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
      animation: pt-float 4s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .hud[data-state="speaking"]       .pt,
    .hud[data-state="elisha-speaking"].pt { background: var(--pink); box-shadow: 0 0 8px var(--pink); }
    .hud[data-state="thinking"]        .pt { background: var(--purple); box-shadow: 0 0 8px var(--purple); animation-duration: 2.5s; }
    .hud[data-state="error"]           .pt { background: var(--red); }

    .pt:nth-child(1) { left:10%; top:40%; animation-delay: 0s; }
    .pt:nth-child(2) { left:88%; top:26%; animation-delay: -0.5s; }
    .pt:nth-child(3) { left:68%; top:76%; animation-delay: -1.1s; }
    .pt:nth-child(4) { left:20%; top:70%; animation-delay: -1.7s; }
    .pt:nth-child(5) { left:47%; top: 7%; animation-delay: -0.3s; }
    .pt:nth-child(6) { left: 5%; top:55%; animation-delay: -2.0s; }

    @keyframes pt-float {
      0%,100% { transform: translate(0,0) scale(1);   opacity: 0.4; }
      50%      { transform: translate(9px,-16px) scale(1.4); opacity: 1; }
    }

    /* ───────── SPHERE BODY ───────── */
    .sphere {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 22%, rgba(85,120,180,0.5) 0%, transparent 28%),
        radial-gradient(circle at 70% 30%, rgba(50,100,160,0.3) 0%, transparent 32%),
        radial-gradient(circle at 40% 70%, rgba(30,60,130,0.35) 0%, transparent 40%),
        radial-gradient(circle at 50% 48%, #1a1e2a 0%, #0c0e16 42%, #05060c 72%, #020205 100%);
      box-shadow:
        inset 0 0 50px rgba(0,0,0,0.85),
        inset 16px 10px 35px rgba(255,255,255,0.07),
        inset -18px -24px 45px rgba(0,0,0,0.6),
        0 0 0 1px rgba(0,212,255,0.18),
        0 0 36px rgba(0,212,255,0.22),
        0 0 80px rgba(37,99,235,0.14),
        0 24px 50px rgba(0,0,0,0.55);
      overflow: hidden;
      isolation: isolate;
      transition: box-shadow 0.5s;
    }

    .sphere::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.15) 0%, transparent 28%, transparent 60%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .hud[data-state="speaking"]       .sphere,
    .hud[data-state="elisha-speaking"].sphere {
      box-shadow:
        inset 0 0 50px rgba(0,0,0,0.85),
        inset 16px 10px 35px rgba(255,255,255,0.07),
        0 0 0 1px rgba(236,72,153,0.28),
        0 0 44px rgba(236,72,153,0.28),
        0 0 90px rgba(168,85,247,0.22),
        0 24px 50px rgba(0,0,0,0.55);
    }

    .hud[data-state="error"] .sphere {
      box-shadow:
        inset 0 0 50px rgba(0,0,0,0.85),
        0 0 0 1px rgba(239,68,68,0.5),
        0 0 40px rgba(239,68,68,0.4),
        0 24px 50px rgba(0,0,0,0.55);
    }

    /* Surface plates */
    .plate {
      position: absolute; z-index: 2;
      border-radius: 40%;
      background: linear-gradient(160deg, rgba(40,55,80,0.35), rgba(12,20,40,0.15));
      border: 1px solid rgba(85,120,180,0.1);
      pointer-events: none;
    }
    .plate-1 { width:22%; height:16%; top:14%; left:18%; transform: rotate(-18deg); }
    .plate-2 { width:18%; height:12%; top:18%; right:16%; transform: rotate(22deg); }

    /* Crack lines SVG */
    .cracks { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0.45; }
    .cracks path { fill: none; stroke: rgba(0,212,255,0.28); stroke-width: 1.1; vector-effect: non-scaling-stroke; }

    /* ───────── X EYES ───────── */
    .eyes {
      position: absolute;
      left: 50%; top: 44%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: clamp(20px, 5vw, 50px);
      pointer-events: none;
      transition: gap 0.5s ease;
    }

    /* Eye wrapper — holds orbit ring + svg */
    .eye-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width:  clamp(52px, 8vw, 88px);
      height: clamp(52px, 8vw, 88px);
      transition: width 0.4s, height 0.4s;
    }

    /* Orbit ring — only visible in tool state */
    .eye-orbit {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(34,197,94,0.5);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .hud[data-state="tool"] .eye-orbit {
      opacity: 1;
      animation: eye-orbit-spin 1s linear infinite;
    }

    @keyframes eye-orbit-spin { to { transform: rotate(360deg); } }

    /* Eye SVG */
    .eye-svg {
      width: 100%; height: 100%;
      overflow: visible;
      transition: transform 0.06s, filter 0.4s;
      will-change: transform, filter;
    }

    /* SVG line styles */
    .xl1, .xl2 { /* outer glow stroke */
      fill: none;
      stroke: var(--eye-color);
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke 0.4s;
    }
    .xc1, .xc2 { /* bright white core */
      fill: none;
      stroke: #e8fcff;
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke 0.4s, opacity 0.4s;
    }

    /* Sleep dot — hidden normally */
    .eye-dot {
      fill: rgba(255,255,255,0.4);
      opacity: 0;
      transform: scale(0);
      transform-origin: center;
      transition: opacity 0.5s, transform 0.5s;
    }

    /* ── EYE STATE OVERRIDES ── */

    /* IDLE: gentle breathing glow */
    .hud[data-state="idle"] .eye-svg {
      filter:
        drop-shadow(0 0 3px #fff)
        drop-shadow(0 0 10px var(--cyan))
        drop-shadow(0 0 24px rgba(0,212,255,0.6));
      animation: eye-idle 2.8s ease-in-out infinite;
    }
    @keyframes eye-idle {
      0%,100% { transform: scale(1);    filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px var(--cyan)) drop-shadow(0 0 24px rgba(0,212,255,0.5)); }
      50%      { transform: scale(1.04); filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px var(--cyan)) drop-shadow(0 0 36px rgba(0,212,255,0.75)); }
    }

    /* LISTENING: brighter + micro-vibrate */
    .hud[data-state="listening"] .eye-svg {
      --eye-color: #00eaff;
      filter:
        drop-shadow(0 0 5px #fff)
        drop-shadow(0 0 12px var(--cyan-hot))
        drop-shadow(0 0 28px rgba(0,238,255,0.8));
      animation: eye-listen 0.18s ease-in-out infinite;
    }
    @keyframes eye-listen {
      0%,100% { transform: translate(0,0); }
      25%      { transform: translate(1px,-1px); }
      75%      { transform: translate(-1px,1px); }
    }

    /* USER SPEAKING: amplitude-driven scale via CSS var */
    .hud[data-state="user-speaking"] .eye-svg {
      --eye-color: #00eaff;
      filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px var(--cyan-hot)) drop-shadow(0 0 30px rgba(0,238,255,0.75));
      transform: scale(var(--amplitude));
      animation: eye-user-side 0.6s ease-in-out infinite;
    }
    @keyframes eye-user-side {
      0%,100% { margin-left: 0; }
      33%      { margin-left: 2px; }
      66%      { margin-left: -2px; }
    }

    /* ELISHA SPEAKING: amplitude-driven scale, pink/cyan */
    .hud[data-state="speaking"] .eye-svg,
    .hud[data-state="elisha-speaking"] .eye-svg {
      filter:
        drop-shadow(0 0 4px #fff)
        drop-shadow(0 0 10px var(--cyan))
        drop-shadow(0 0 22px rgba(236,72,153,0.7));
      transform: scale(var(--amplitude));
    }
    .hud[data-state="speaking"]       .xl1,
    .hud[data-state="speaking"]       .xl2,
    .hud[data-state="elisha-speaking"].xl1,
    .hud[data-state="elisha-speaking"].xl2 {
      stroke: var(--pink);
    }

    /* THINKING: rotation + distort */
    .hud[data-state="thinking"] .eye-svg {
      --eye-color: var(--purple);
      filter:
        drop-shadow(0 0 4px #fff)
        drop-shadow(0 0 10px var(--purple))
        drop-shadow(0 0 24px rgba(168,85,247,0.65));
      animation: eye-think 1s ease-in-out infinite;
    }
    .hud[data-state="thinking"] .xl1,
    .hud[data-state="thinking"] .xl2 { stroke: var(--purple); }
    @keyframes eye-think {
      0%     { transform: rotate(0deg) scale(1) skewX(0deg); }
      20%    { transform: rotate(10deg) scale(1.08) skewX(4deg); }
      50%    { transform: rotate(0deg) scale(0.92) skewX(-3deg); }
      80%    { transform: rotate(-8deg) scale(1.05) skewX(2deg); }
      100%   { transform: rotate(0deg) scale(1) skewX(0deg); }
    }

    /* TOOL RUNNING: steady glow, green */
    .hud[data-state="tool"] .eye-svg {
      filter:
        drop-shadow(0 0 4px #fff)
        drop-shadow(0 0 10px var(--green))
        drop-shadow(0 0 22px rgba(34,197,94,0.6));
      animation: eye-tool-pulse 1.2s ease-in-out infinite;
    }
    .hud[data-state="tool"] .xl1,
    .hud[data-state="tool"] .xl2 { stroke: var(--green); }
    @keyframes eye-tool-pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    /* ERROR: red glitch */
    .hud[data-state="error"] .eye-svg {
      filter:
        drop-shadow(0 0 4px #fff)
        drop-shadow(0 0 10px var(--red))
        drop-shadow(0 0 22px rgba(239,68,68,0.8));
      animation: eye-glitch 0.25s steps(3) infinite;
    }
    .hud[data-state="error"] .xl1,
    .hud[data-state="error"] .xl2 { stroke: var(--red); }
    .hud[data-state="error"] .xc1,
    .hud[data-state="error"] .xc2 { stroke: #ffaaaa; }
    @keyframes eye-glitch {
      0%   { transform: translate(0,0) skewX(0deg);    clip-path: none; }
      33%  { transform: translate(-3px,1px) skewX(6deg); }
      66%  { transform: translate(3px,-2px) skewX(-4deg); }
      100% { transform: translate(0,0) skewX(0deg); }
    }

    /* SLEEP: X lines shrink, dot appears */
    .hud[data-state="sleep"] .eye-svg {
      animation: eye-sleep-breathe 4s ease-in-out infinite;
    }
    .hud[data-state="sleep"] .xl1,
    .hud[data-state="sleep"] .xl2 {
      stroke: rgba(255,255,255,0.12);
      stroke-width: 4;
      transition: stroke-width 0.8s, stroke 0.8s;
    }
    .hud[data-state="sleep"] .xc1,
    .hud[data-state="sleep"] .xc2 {
      opacity: 0;
      transition: opacity 0.8s;
    }
    .hud[data-state="sleep"] .eye-dot {
      opacity: 1;
      transform: scale(1);
    }
    @keyframes eye-sleep-breathe {
      0%,100% { opacity: 0.4; }
      50%      { opacity: 0.7; }
    }

    /* Eye gap per state */
    .hud[data-state="speaking"]       .eyes,
    .hud[data-state="elisha-speaking"].eyes { gap: clamp(14px, 3vw, 28px); }
    .hud[data-state="thinking"]        .eyes { gap: clamp(16px, 3.5vw, 32px); }
    .hud[data-state="sleep"]           .eyes { gap: clamp(10px, 2vw, 20px); }

    /* Eye link (connection bar in speaking mode) */
    .eye-link {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      height: 3px;
      width: 0;
      border-radius: 2px;
      background: var(--cyan-hot);
      box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
      opacity: 0;
      transition: width 0.45s ease, opacity 0.35s ease;
      z-index: 4;
    }

    .hud[data-state="speaking"]       .eye-link,
    .hud[data-state="elisha-speaking"].eye-link {
      width: clamp(20px, 3.5vw, 40px);
      opacity: 1;
    }

    /* ───────── RIGHT COLUMN ───────── */
    .right-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
      justify-content: space-between;
    }

    .status-label {
      font-family: var(--font-d);
      font-size: clamp(14px, 1.4vw, 19px);
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(0,212,255,0.45);
      text-align: right;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .hud[data-state="speaking"]       .status-label,
    .hud[data-state="elisha-speaking"].status-label { color: var(--pink); text-shadow: 0 0 14px rgba(236,72,153,0.5); }
    .hud[data-state="thinking"]        .status-label { color: var(--purple); }
    .hud[data-state="tool"]            .status-label { color: var(--green); }
    .hud[data-state="error"]           .status-label { color: var(--red); }
    .hud[data-state="sleep"]           .status-label { color: var(--muted); }

    /* Waveform */
    .wave-right {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 3px;
      height: 32px;
    }

    .wave-right span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--cyan-hot), var(--blue));
      box-shadow: 0 0 6px var(--cyan);
      transform-origin: bottom center;
      height: 35%;
    }

    /* Animate waveform only when active */
    .hud[data-state="listening"]     .wave-right span,
    .hud[data-state="user-speaking"] .wave-right span { animation: bar-bounce 0.9s ease-in-out infinite; }
    .hud[data-state="speaking"]      .wave-right span,
    .hud[data-state="elisha-speaking"].wave-right span {
      animation: bar-bounce 0.55s ease-in-out infinite;
      background: linear-gradient(180deg, #ff7ad9, var(--purple));
      box-shadow: 0 0 8px var(--pink);
    }

    .wave-right span:nth-child(1)  { animation-delay: 0.05s; }
    .wave-right span:nth-child(2)  { animation-delay: 0.15s; }
    .wave-right span:nth-child(3)  { animation-delay: 0.00s; }
    .wave-right span:nth-child(4)  { animation-delay: 0.22s; }
    .wave-right span:nth-child(5)  { animation-delay: 0.10s; }
    .wave-right span:nth-child(6)  { animation-delay: 0.28s; }
    .wave-right span:nth-child(7)  { animation-delay: 0.08s; }
    .wave-right span:nth-child(8)  { animation-delay: 0.18s; }
    .wave-right span:nth-child(9)  { animation-delay: 0.02s; }
    .wave-right span:nth-child(10) { animation-delay: 0.25s; }
    .wave-right span:nth-child(11) { animation-delay: 0.12s; }
    .wave-right span:nth-child(12) { animation-delay: 0.20s; }

    /* Info card */
    .info-card {
      position: relative;
      width: min(210px, 100%);
      padding: 16px 14px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .info-card::before,
    .info-card::after,
    .ibr-bl, .ibr-br {
      content: "";
      position: absolute;
      width: 10px; height: 10px;
      pointer-events: none;
    }
    .info-card::before { top:-1px; left:-1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .info-card::after  { top:-1px; right:-1px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
    .ibr-bl { bottom:-1px; left:-1px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .ibr-br { bottom:-1px; right:-1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

    .face-badge {
      width: 40px; height: 26px;
      display: grid; place-items: center;
      border: 1px solid rgba(0,212,255,0.2);
      background: rgba(0,212,255,0.07);
      margin-bottom: 10px;
    }
    .face-badge svg { width: 32px; height: 14px; overflow: visible; }
    .face-badge path { fill: none; stroke: var(--cyan); stroke-width: 3.5; stroke-linecap: round; }

    .card-title {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Clock */
    .clock { text-align: right; }

    .clock-time {
      font-family: var(--font-d);
      font-size: clamp(36px, 5vw, 66px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--fg);
      text-shadow: 0 0 24px rgba(0,212,255,0.2);
      font-variant-numeric: tabular-nums;
    }
    .clock-date {
      font-family: var(--font-d);
      font-size: clamp(11px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-top: 3px;
    }
    .clock-day {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ───────── TOAST ───────── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,212,255,0.12);
      border: 1px solid rgba(0,212,255,0.3);
      color: var(--cyan);
      font-family: var(--font-d);
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      z-index: 500;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ───────── RESPONSIVE ───────── */
    @media (max-width: 900px) {
      .frame {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto;
        overflow-y: auto;
        padding: 12px;
        gap: 10px;
        height: calc(100% - 36px);
      }

      .left-col {
        grid-row: 1;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
      }

      .brand    { flex: 1 1 140px; }
      .sidenav  { flex: 2 1 200px; flex-direction: row; flex-wrap: wrap; gap: 4px; }
      .nav-item { border-left: none; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; padding: 6px 10px; }
      .nav-item.is-active { border-bottom-color: var(--cyan); border-left-color: transparent; }
      .panels   { flex: 1 1 100%; }

      .sphere-stage { grid-row: 2; min-height: 44vh; }
      :root { --sphere-size: min(44vh, 380px); }

      .right-col {
        grid-row: 3;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
      }

      .info-card { width: 100%; }
    }

    @media (max-width: 560px) {
      .brand-name  { font-size: 22px; }
      .clock-time  { font-size: 28px; }
      .nav-item    { font-size: 11px; letter-spacing: 0.05em; }
      .sidenav     { gap: 2px; }
      :root { --sphere-size: min(38vh, 300px); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Window chrome -->
  <div class="win-chrome" id="winChrome">
    <div class="win-buttons">
      <button class="win-btn win-close"    title="Kapat"    onclick="winClose()">×</button>
      <button class="win-btn win-minimize" title="Küçült"   onclick="winMinimize()">−</button>
    </div>
    <div class="win-title">ELISHA HUD</div>
    <div class="win-pills">
      <span class="wpill" id="pillStt">STT</span>
      <span class="wpill" id="pillTts">TTS</span>
      <span class="wpill" id="pillLlm">LLM</span>
    </div>
  </div>

  <!-- Resize grip -->

  <script>
  (function () {
    "use strict";

    /* ───── ELEMENTS ───── */
    var hud        = document.getElementById("hud");
    var promptText = document.getElementById("promptText");
    var statusLabel= document.getElementById("statusLabel");
    var cardTitle  = document.getElementById("cardTitle");
    var cardSub    = document.getElementById("cardSub");
    var clockTime  = document.getElementById("clockTime");
    var clockDate  = document.getElementById("clockDate");
    var clockDay   = document.getElementById("clockDay");
    var miniChat   = document.getElementById("miniChat");
    var chatForm   = document.getElementById("chatForm");
    var textInput  = document.getElementById("textInput");
    var micBtn     = document.getElementById("micBtn");
    var sphereHit  = document.getElementById("sphereHit");
    var pillStt    = document.getElementById("pillStt");
    var pillTts    = document.getElementById("pillTts");
    var pillLlm    = document.getElementById("pillLlm");
    var toast      = document.getElementById("toast");
    var eyeLeft    = document.getElementById("eyeLeft");
    var eyeRight   = document.getElementById("eyeRight");

    /* ───── STATE MACHINE ───── */
    var STATE = {
      IDLE:          "idle",
      LISTENING:     "listening",
      USER_SPEAKING: "user-speaking",
      SPEAKING:      "speaking",
      THINKING:      "thinking",
      TOOL:          "tool",
      ERROR:         "error",
      SLEEP:         "sleep"
    };

    var currentState = STATE.IDLE;
    var ttsEnabled   = true;
    var micActive    = false;
    var listenJobId  = null;

    var PROMPTS = {
      "idle":          "NE DÜŞÜNÜYORSUN?",
      "listening":     "DİNLİYORUM…",
      "user-speaking": "SENİ DİNLİYORUM",
      "speaking":      "SENİ DİNLİYORUM",
      "thinking":      "DÜŞÜNÜYORUM…",
      "tool":          "ÇALIŞIYORUM…",
      "error":         "BİR SORUN OLUŞTU",
      "sleep":         "UYKU MODUNDA"
    };

    var STATUS_LABELS = {
      "idle":          "BEKLIYOR",
      "listening":     "DİNLİYOR",
      "user-speaking": "SESİNİ ALIYOR",
      "speaking":      "KONUŞUYOR",
      "thinking":      "DÜŞÜNÜYOR",
      "tool":          "ARAÇ ÇALIŞIYOR",
      "error":         "HATA",
      "sleep":         "UYKU"
    };

    var CARD_TITLES = {
      "idle":          "KONUŞMAYA HAZIR",
      "listening":     "SENI DINLIYORUM",
      "user-speaking": "AMPLITÜD ALINIYOR",
      "speaking":      "SENİ ANLIYORUM",
      "thinking":      "HESAPLIYORUM",
      "tool":          "ARAÇ ÇALIŞIYOR",
      "error":         "LÜTFEN TEKRAR DENE",
      "sleep":         "UYUYOR"
    };

    function setState(s) {
      if (currentState === s) return;
      currentState = s;
      hud.setAttribute("data-state", s);
      promptText.textContent  = PROMPTS[s]     || "HAZIR";
      statusLabel.textContent = STATUS_LABELS[s]|| "HAZIR";
      cardTitle.textContent   = CARD_TITLES[s]  || "HAZIR";
    }

    /* ───── CLOCK ───── */
    var MONTHS = ["OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN","TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"];
    var DAYS   = ["PAZAR","PAZARTESİ","SALI","ÇARŞAMBA","PERŞEMBE","CUMA","CUMARTESİ"];

    function pad(n) { return n < 10 ? "0" + n : "" + n; }

    function updateClock() {
      var now = new Date();
      clockTime.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
      clockDate.textContent = now.getDate() + " " + MONTHS[now.getMonth()] + " " + now.getFullYear();
      clockDay.textContent  = DAYS[now.getDay()];
      document.getElementById("sysValTime") && (document.getElementById("sysValTime").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()));
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ───── TOAST ───── */
    var toastTimer = null;
    function showToast(msg, ms) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove("show"); }, ms || 2200);
    }

    /* ───── CHAT LOG ───── */
    function appendMsg(role, text) {
      var el = document.createElement("div");
      el.className = "msg " + role;
      if (role !== "sys") {
        var meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = role === "user" ? "SEN" : "ELİŞA";
        el.appendChild(meta);
      }
      var span = document.createElement("span");
      span.textContent = text;
      el.appendChild(span);
      miniChat.appendChild(el);
      miniChat.scrollTop = miniChat.scrollHeight;
      return span;
    }

    /* ───── API: CHAT ───── */
    async function sendMessage(text) {
      if (!text || !text.trim()) return;
      appendMsg("user", text);
      textInput.value = "";
      setState(STATE.THINKING);

      var botSpan = appendMsg("bot", "…");
      var fullReply = "";

      try {
        var res = await fetch("/api/chat_stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });
        if (!res.ok || !res.body) throw new Error(res.status);

        var reader = res.body.getReader();
        var dec = new TextDecoder();
        var buf = "";

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buf += dec.decode(chunk.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            var raw = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 2);
            if (!raw.startsWith("data: ")) continue;
            var ev;
            try { ev = JSON.parse(raw.slice(6)); } catch(e) { continue; }

            if (ev.type === "status") {
              setState(STATE.TOOL);
              cardSub.textContent = ev.text ? ev.text.slice(0, 32) : "ÇALIŞIYOR";
            } else if (ev.type === "token") {
              fullReply += ev.text;
              botSpan.textContent = fullReply;
              miniChat.scrollTop = miniChat.scrollHeight;
            } else if (ev.type === "done") {
              fullReply = ev.reply || fullReply;
              botSpan.textContent = fullReply;
            } else if (ev.type === "error") {
              botSpan.textContent = "Hata: " + (ev.error || "bilinmeyen");
              setState(STATE.ERROR);
              setTimeout(function() { setState(STATE.IDLE); }, 2500);
              return;
            }
          }
        }

        if (!fullReply) botSpan.textContent = "…";
        cardSub.textContent = "BANA BİR ŞEY SÖYLE";
        playResponseChime(); // ← "cevap veriyorum" sesi
        setState(STATE.SPEAKING);
        // server tarafında TTS zaten çalıyor; burada sadece speaking state göster
        setTimeout(function() { setState(STATE.IDLE); }, 3500);

      } catch(e) {
        // Fallback: basit /api/chat
        try {
          var r2 = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text, tts: ttsEnabled })
          });
          var j = await r2.json();
          botSpan.textContent = j.reply || "…";
          setState(STATE.SPEAKING);
          setTimeout(function() { setState(STATE.IDLE); }, 3000);
        } catch(e2) {
          botSpan.textContent = "Sunucuya bağlanılamadı.";
          setState(STATE.ERROR);
          setTimeout(function() { setState(STATE.IDLE); }, 3000);
        }
      }
    }

    /* ───── API: LISTEN (async STT) ───── */
    var listenPollTimer = null;

    /* ───── WEB AUDIO CHIMES ───── */
    var _audioCtxChime = null;
    function _getChimeCtx() {
      if (!_audioCtxChime || _audioCtxChime.state === "closed") {
        _audioCtxChime = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (_audioCtxChime.state === "suspended") _audioCtxChime.resume();
      return _audioCtxChime;
    }

    function playWakeChime() {
      try {
        var ctx = _getChimeCtx();
        // İki kısa yükselen ton: "dinliyorum"
        [[660, 0], [880, 0.10]].forEach(function(pair) {
          var freq = pair[0], delay = pair[1];
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, ctx.currentTime + delay);
          gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + delay + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.14);
        });
      } catch(e) {}
    }

    function playResponseChime() {
      try {
        var ctx = _getChimeCtx();
        // Tek yumuşak ton: "cevap veriyorum"
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(550, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    async function startListen() {
      if (micActive) { stopListen(); return; }
      micActive = true;
      micBtn.classList.add("active");
      micBtn.setAttribute("aria-pressed", "true");
      setState(STATE.LISTENING);
      playWakeChime();  // ← anlık "dinliyorum" sesi
      startMicVisual();

      try {
        var res = await fetch("/api/listen", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ duration: 6 })
        });
        var j = await res.json();
        listenJobId = j.id;

        // Poll result
        listenPollTimer = setInterval(async function() {
          try {
            var r2 = await fetch("/api/listen/result", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: listenJobId })
            });
            var result = await r2.json();
            if (result.status === "done") {
              clearInterval(listenPollTimer);
              stopListen();
              if (result.error) {
                showToast("⚠️ Mikrofon hatası: " + result.error, 3000);
                setState(STATE.IDLE);
              } else if (result.silent || !result.text) {
                showToast("🎙 Ses algılanamadı — tekrar dene", 2500);
                setState(STATE.IDLE);
              } else if (result.text) {
                showToast("🎙 Duydum: " + result.text.slice(0, 60), 2000);
                await sendMessage(result.text);
              } else {
                setState(STATE.IDLE);
              }
            }
          } catch(e) {
            clearInterval(listenPollTimer);
            stopListen();
            setState(STATE.IDLE);
          }
        }, 400);

      } catch(e) {
        stopListen();
        setState(STATE.IDLE);
        showToast("Sunucuya bağlanılamadı. Sunucu çalışıyor mu?");
      }
    }

    function stopListen() {
      micActive = false;
      micBtn.classList.remove("active");
      micBtn.setAttribute("aria-pressed", "false");
      stopMicVisual();
      if (listenPollTimer) { clearInterval(listenPollTimer); listenPollTimer = null; }
    }

    /* ───── WEB AUDIO: MIC AMPLITUDE ───── */
    var audioCtx = null;
    var analyser = null;
    var micStream = null;
    var animFrameId = null;
    var lastAmpTime = 0;
    var _simAmpPhase = 0;

    function startMicVisual() {
      // Mikrofon tarayıcıdan istenmez — Python/sounddevice server-side kaydeder.
      // Simüle edilmiş amplitude animasyonu (izin popup'u yok)
      if (animFrameId) return;
      animFrameId = requestAnimationFrame(updateAmpLoop);
    }

    function stopMicVisual() {
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
      hud.style.setProperty("--amplitude", "1");
    }

    function updateAmpLoop(ts) {
      // Throttle ~30fps
      if (ts - lastAmpTime < 33) {
        animFrameId = requestAnimationFrame(updateAmpLoop);
        return;
      }
      lastAmpTime = ts;

      // Simüle sinüs dalgası — gerçek mikrofon olmadan pulsating görüntü
      _simAmpPhase += 0.08;
      var base = 0.18;
      var wave = base + 0.12 * Math.sin(_simAmpPhase) + 0.06 * Math.sin(_simAmpPhase * 2.3);
      var scale = 1 + wave * 1.4;
      if (scale > 2.0) scale = 2.0;
      hud.style.setProperty("--amplitude", scale.toFixed(3));

      animFrameId = requestAnimationFrame(updateAmpLoop);
    }

    /* ───── SPHERE CLICK ───── */
    sphereHit.addEventListener("click", function() {
      if (currentState === STATE.IDLE || currentState === STATE.SLEEP) {
        startListen();
      } else if (currentState === STATE.LISTENING || currentState === STATE.USER_SPEAKING) {
        stopListen();
        setState(STATE.IDLE);
      }
    });

    /* ───── MIC BUTTON ───── */
    micBtn.addEventListener("click", function() {
      startListen();
    });

    /* ───── FORM SUBMIT ───── */
    chatForm.addEventListener("submit", function(e) {
      e.preventDefault();
      var text = textInput.value.trim();
      if (!text) return;
      sendMessage(text);
    });

    /* ───── NAV SWITCHING ───── */
    document.querySelectorAll(".nav-item").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var panelId = btn.getAttribute("data-panel");

        // Active nav
        document.querySelectorAll(".nav-item").forEach(function(b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");

        // Active panel
        document.querySelectorAll(".cpanel").forEach(function(p) { p.classList.remove("is-active"); });
        var target = document.getElementById("panel-" + panelId);
        if (target) target.classList.add("is-active");

        // On-select actions
        if (panelId === "system") refreshStatus();
      });
    });

    /* ───── SYSTEM PANEL ───── */
    window.refreshStatus = async function() {
      var conn = document.getElementById("sysValConn");
      conn.textContent = "Kontrol ediliyor…";
      try {
        var res = await fetch("/api/status");
        var j = await res.json();
        document.getElementById("sysValStt").textContent = j.stt || "—";
        document.getElementById("sysValTts").textContent = j.tts || "—";
        document.getElementById("sysValLlm").textContent = (j.llm || "—") + " (" + (j.provider || "?") + ")";
        var provEl = document.getElementById("sysValProvider");
        if (provEl) provEl.textContent = j.provider || "—";
        conn.textContent = "✓ Bağlı";
        pillStt.textContent = (j.stt || "STT").toUpperCase().slice(0,8);
        pillStt.className = "wpill ok";
        pillTts.textContent = (j.tts || "TTS").toUpperCase().slice(0,8);
        pillTts.className = "wpill ok";
        var llmLabel = (j.provider || j.llm || "LLM").toUpperCase().slice(0,8);
        pillLlm.textContent = llmLabel;
        pillLlm.className = "wpill " + (j.provider === "groq" || j.provider === "gemini" ? "ok" : "on");
      } catch(e) {
        conn.textContent = "✗ Bağlantı yok";
      }
    };

    /* ───── SETTINGS PANEL ───── */
    window.toggleSetting = function(key, el) {
      el.classList.toggle("on");
      var isOn = el.classList.contains("on");
      // Kalıcı olarak kaydet
      var payload = {};
      payload[key] = isOn;
      fetch("/api/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      }).catch(function() {});

      if (key === "tts_enabled") {
        ttsEnabled = isOn;
        showToast("TTS " + (isOn ? "açık" : "kapalı"));
      } else if (key === "wake_enabled") {
        fetch(isOn ? "/api/wake_enable" : "/api/wake_disable").catch(function() {});
        showToast("Wakeword " + (isOn ? "açık" : "kapalı"));
      }
    };

    window.changeSetting = function(key, value) {
      var payload = {};
      payload[key] = value;
      fetch("/api/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      }).catch(function() {});
      if (key === "speed") {
        document.getElementById("valSpeed").textContent = value.toFixed(1);
        showToast("Hız: " + value.toFixed(1));
      } else if (key === "provider") {
        showToast("Provider: " + value);
      } else if (key === "theme") {
        showToast("Tema: " + value);
      }
    };

    // Başlangıçta ayarları yükle
    (async function loadSettings() {
      try {
        var r = await fetch("/api/settings");
        var s = await r.json();
        if (s.tts_enabled === false) document.getElementById("toggleTts").classList.remove("on");
        if (s.wake_enabled) document.getElementById("toggleWake").classList.add("on");
        if (s.provider) document.getElementById("selProvider").value = s.provider;
        if (s.speed) {
          document.getElementById("rangeSpeed").value = s.speed;
          document.getElementById("valSpeed").textContent = s.speed.toFixed ? s.speed.toFixed(1) : s.speed;
        }
        if (s.theme) document.getElementById("selTheme").value = s.theme;
        ttsEnabled = s.tts_enabled !== false;
      } catch(e) {}
    })();

    /* ───── STATUS POLLING ───── */
    refreshStatus();
    setInterval(refreshStatus, 20000);

    /* ───── WAKE CHECK (external) ───── */
    setInterval(async function() {
      try {
        var res = await fetch("/api/wake_check");
        var j = await res.json();
        if (j.wake) {
          showToast("Hey ELİŞA!");
          if (currentState === STATE.SLEEP) setState(STATE.IDLE);
          startListen();
        }
      } catch(e) { /* ok */ }
    }, 1200);

    /* ───── WINDOW CONTROLS ───── */
    window.winClose = function() {
      // Uygulamayı kapatma — sadece gizle (arka planda çalışmaya devam)
      try { window.pywebview.api.hide_app(); return; } catch(e) {}
      try { window.pywebview.api.close();    return; } catch(e) {}
    };
    window.winMinimize = function() {
      try { window.pywebview.api.hide_app(); return; } catch(e) {}
      try { window.pywebview.api.minimize(); return; } catch(e) {}
    };

    /* ───── KEEP ALIVE (pywebview auto-hide timer sıfırla) ───── */
    setInterval(function() {
      try { window.pywebview.api.keep_alive(); } catch(e) {}
    }, 5000);

    /* ───── ELISHA_EXTERNAL_WAKE (desktop_app.py tarafından çağrılır) ───── */
    window.ELISHA_EXTERNAL_WAKE = function(reason) {
      if (currentState === STATE.SLEEP) setState(STATE.IDLE);
      showToast("Hey ELİŞA!");
      startListen();
    };

    /* ───── startListen ve setState global expose (desktop_app.py JS için) ───── */
    window.setState   = setState;
    window.startListen = startListen;
    window.showToast   = showToast;

    /* ───── RESIZE GRIP ───── */
    (function() {
      var grip = document.getElementById("resizeGrip");
      var resizing = false;
      var startX, startY, startW, startH;

      grip.addEventListener("mousedown", function(e) {
        e.preventDefault();
        resizing = true;
        startX = e.clientX; startY = e.clientY;
        startW = window.outerWidth; startH = window.outerHeight;
        document.body.style.cursor = "se-resize";
      });

      document.addEventListener("mousemove", function(e) {
        if (!resizing) return;
        var dw = e.clientX - startX;
        var dh = e.clientY - startY;
        try { window.resizeTo(startW + dw, startH + dh); } catch(e) {}
      });

      document.addEventListener("mouseup", function() {
        if (resizing) { resizing = false; document.body.style.cursor = ""; }
      });
    })();

    /* ───── KEYBOARD ───── */
    document.addEventListener("keydown", function(e) {
      if (e.key === " " && document.activeElement === document.body) {
        e.preventDefault();
        if (currentState === STATE.IDLE || currentState === STATE.SLEEP) startListen();
        else if (currentState === STATE.LISTENING) { stopListen(); setState(STATE.IDLE); }
      }
      if (e.key === "Escape") {
        stopListen();
        setState(STATE.IDLE);
      }
    });

    /* ───── INIT ───── */
    appendMsg("bot", "Merhaba — çevrimiçiyim. Bir şey sor veya mikrofonu kullan.");
    setState(STATE.IDLE);

    // Simulate sleep after 5min idle (demo)
    var idleTimer = null;
    function resetIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        if (currentState === STATE.IDLE) setState(STATE.SLEEP);
      }, 5 * 60 * 1000);
    }
    document.addEventListener("mousemove", resetIdle);
    document.addEventListener("keydown", resetIdle);
    resetIdle();

  })();
  </script>
</body>
</html>
